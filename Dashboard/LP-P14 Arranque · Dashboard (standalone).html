  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"es\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>LP-P14 · Arranque · Dashboard interactivo<\u002Ftitle>\n<style>/* lp14-arranque.css — Dashboard interactivo LP-P14 · Arranque.\n   Vibra consultoría (McKinsey): tinta profunda, mucho aire, hairlines,\n   labels en versalitas, serif editorial para titulares. Acento por fase. */\n\n/* Google Fonts removed for offline bundling — using system fonts fallback */\n\n:root{\n  --ink:#08233B;        /* deep navy ink */\n  --ink-soft:#294055;\n  --brand:#1A4088;      /* ADF */\n  --accent:#2E6BE6;     /* thin bright line */\n  --paper:#ffffff;\n  --bg:#F3F2EE;         /* warm light stage */\n  --panel:#FBFAF7;\n  --line:#E4E2DB;\n  --line-2:#D7D4CB;\n  --muted:#71757B;\n  --muted-2:#9A9C9E;\n  --font-d:'Georgia','Spectral',serif;\n  --font-s:'-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','Barlow',sans-serif;\n  --font-c:'-apple-system','BlinkMacSystemFont','Segoe UI','Roboto Condensed','Barlow Condensed',sans-serif;\n}\n\n*{ box-sizing:border-box; }\n\ndeck-stage:not(:defined){ visibility:hidden; }\ndeck-stage{ --deck-bg:#20242a; }\n\n.slide{\n  width:1920px; height:1080px; position:relative; overflow:hidden;\n  background:var(--bg); color:var(--ink);\n  font-family:var(--font-s); -webkit-font-smoothing:antialiased;\n}\n\n/* subtle paper grain / edge */\n.slide::after{\n  content:\"\"; position:absolute; inset:0; pointer-events:none;\n  box-shadow:inset 0 0 0 1px rgba(8,35,59,.04);\n}\n\n/* ---------- shared header ---------- */\n.hdr{ position:absolute; top:64px; left:96px; right:96px;\n  display:flex; justify-content:space-between; align-items:flex-start; z-index:5; }\n.hdr-brand{ display:flex; align-items:center; gap:18px; }\n.hdr-brand img{ height:40px; width:auto; display:block; }\n.hdr-brand .bar{ width:1.5px; height:40px; background:var(--line-2); }\n.hdr-eyebrow{ font:600 15px/1.1 var(--font-c); letter-spacing ter; gap:10px; color:var(--ink-soft); }\n.hub-foot .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }\n\n/* ============================================================ PHASE === */\n.phase{ }\n.ph-title{ position:absolute; top:168px; left:96px; right:96px;\n  display:flex; align-items:flex-end; gap:26px;\n  border-bottom:1px solid var(--line); padding-bottom:26px; }\n.ph-num{ font:600 92px/0.78 var(--font-d); color:var(--pa,#999); letter-spacing:-.02em; }\n.ph-heading{ flex:1; }\n.ph-heading .of{ font:600 13px/1 var(--font-c); letter-spacing:.24em; color:var(--muted); text-transform:uppercase; }\n.ph-heading h2{ font:500 52px/0.98 var(--font-d); color:var(--ink); margin:8px 0 0; }\n.ph-heading p{ font:400 19px/1.4 var(--font-s); color:var(--ink-soft); margin:12px 0 0; max-width:1050px; text-wrap:pretty; }\n.ph-back{ align-self:flex-start; margin-top:6px; border:1px solid var(--line-2); background:var(--paper);\n  border-radius:999px; padding:11px 20px; cursor:pointer;\n  font:600 12px/1 var(--font-c); letter-spacing:.18em; color:var(--ink-soft); text-transform:uppercase;\n  display:flex; align-items:center; gap:9px; transition:border-color .2s,color .2s; white-space:nowrap; }\n.ph-back:hover{ border-color:var(--ink); color:var(--ink); }\n.ph-back svg{ width:15px; height:11px; }\n\n/* step grid */\n.steps{ position:absolute; left:96px; right:96px; top:404px; bottom:64px;\n  display:grid; grid-template-columns:repeat(4,1fr); gap:22px; align-content:start; }\n.steps.rows-2{ grid-auto-rows:minmax(0,1fr); }\n\n.step{ position:relative; background:var(--paper); border:1px solid var(--line);\n  border-left:4px solid var(--pa,#999); padding:24px 24px 20px; cursor:pointer; text-align:left;\n  display:flex; flex-direction:column; min-height:0;\n  transition:transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .18s; }\n.step:hover{ transform:translateY(-5px); box-shadow:0 18px 40px -26px rgba(8,35,59,.55); }\n.step:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }\n.step-n{ font:600 15px/1 var(--font-c); letter-spacing:.14em; color:var(--pa,#999); text-transform:uppercase; }\n.step-t{ font:600 25px/1.14 var(--font-d); color:var(--ink); margin:12px 0 0; flex:1; text-wrap:pretty; }\n.step-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; }\n.step-tool{ font:500 13px/1.3 var(--font-s); color:var(--muted); max-width:78%;\n  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.step-tool span{ color:var(--muted-2); }\n.step-more{ flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--line-2);\n  display:flex; align-items:center; justify-content:center; color:var(--pa,#999);\n  transition:background .2s,color .2s,border-color .2s; }\n.step:hover .step-more{ background:var(--pa,#999); border-color:var(--pa,#999); color:#fff; }\n.step-more svg{ width:13px; height:13px; }\n\n/* phase 3 feature (single link-out step) */\n.feature{ position:absolute; left:96px; right:96px; top:404px; bottom:64px;\n  display:grid; grid-template-columns:1fr 1fr; gap:40px; }\n.feature .media{ position:relative; }\n.feature .fbody{ display:flex; flex-direction:column; justify-content:center; }\n.feature h3{ font:500 40px/1.04 var(--font-d); color:var(--ink); margin:0; }\n.feature p{ font:400 20px/1.5 var(--font-s); color:var(--ink-soft); margin:18px 0 0; max-width:640px; text-wrap:pretty; }\n.feature .tools{ margin-top:24px; }\n.link-btn{ display:inline-flex; align-items:center; gap:14px; margin-top:34px;\n  background:var(--pa,#1A4088); color:#fff; text-decoration:none;\n  padding:18px 30px; font:600 15px/1 var(--font-c); letter-spacing:.14em; text-transform:uppercase;\n  transition:transform .18s, box-shadow .18s; align-self:flex-start; }\n.link-btn:hover{ transform:translateY(-3px); box-shadow:0 18px 36px -20px rgba(8,35,59,.7); }\n.link-btn svg{ width:20px; height:14px; }\n\n/* chips (tools) */\n.tools{ display:flex; flex-wrap:wrap; gap:10px; }\n.chi r-left-color:var(--pa); background:#F3F8F6; }\n.db-n{ flex:none; width:28px; height:28px; border-radius:50%; background:#EAEDEA; color:var(--pa);\n  font:700 14px/28px var(--font-s); text-align:center; }\n.db-step.on .db-n{ background:var(--pa); color:#fff; }\n.db-t{ flex:1; font:600 17px/1.2 var(--font-d); color:var(--ink); }\n.db-more{ flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--line-2);\n  display:flex; align-items:center; justify-content:center; color:var(--pa); transition:background .18s,color .18s; }\n.db-more svg{ width:12px; height:12px; }\n.db-more:hover{ background:var(--pa); border-color:var(--pa); color:#fff; }\n.db-readout{ margin-top:auto; border-top:1px solid var(--line); padding-top:16px; }\n.db-readout h4{ font:600 23px/1.15 var(--font-d); color:var(--ink); margin:0 0 8px; }\n.db-readout p{ font:400 16px/1.42 var(--font-s); color:var(--ink-soft); margin:0 0 12px; text-wrap:pretty; }\n.db-readout .db-note{ font:500 14px/1.4 var(--font-s); color:var(--pa); }\n\n/* active-control spotlight on the embedded panel */\n.panel .ctrl{ transition:opacity .3s ease, transform .3s ease, filter .3s ease; }\n.panel-face.has-active .ctrl:not(.is-active){ opacity:.32; }\n.panel .ctrl.is-active{ transform:translate(-50%,-50%) scale(1.16);\n  filter:drop-shadow(0 0 10px rgba(62,124,116,.85)); z-index:6; }\n\n/* ais III keypad + table sizing inside the shared panel layout */\n/* Configuración: tablero + tabla grandes (visibles de lejos), pasos chicos */\n.cf-body{ grid-template-columns:1fr 372px !important; gap:44px !important; top:388px !important; }\n.cf-panelcol{ justify-content:center; }\n.cf-panelcol .db-panel{ display:flex; flex-direction:row; align-items:center; justify-content:center; gap:40px; width:100%; }\n.cf-panelcol .keypad{ margin:0; flex:none; }\n.cf-table{ margin:0 !important; flex:none; width:auto; max-width:780px; align-self:center; }\n.cf-table th, .cf-table td{ padding:11px 7px !important; }\n.cf-table .pth-head{ font-size:17px !important; }\n.cf-table .pth-sub{ font-size:11px !important; }\n.cf-table td{ font-size:21px !important; }\n.cf-table .td-prog, .cf-table .td-largo{ font-size:27px !important; }\n.cf-table.focus{ box-shadow:0 0 0 3px var(--pa); border-radius:4px; }\n/* columna VELOCIDAD (perilla desbobinadora) — casilla para llenar a mano */\n.cf-table{ max-width:860px !important; }\n.cf-table .is-vel{ border-left:2px solid var(--pa); }\n.cf-table th.is-vel .pth-head{ color:var(--pa); }\n.cf-table .td-vel .vel-fill{ display:inline-block; min-width:46px; height:1.2em;\n  border-bottom:2.5px solid var(--pa); vertical-align:middle; }\n\n/* step cards on the right — bigger for Configuración (4 pasos) */\n.cf-body:not(.pr-body) .db-step{ padding:14px 18px; gap:16px; }\n.cf-body:not(.pr-body) .db-n{ width:32px; height:32px; font:700 16px/32px var(--font-s); }\n.cf-body:not(.pr-body) .db-t{ font-size:19px; }\n.cf-body:not(.pr-body) .db-more{ width:28px; height:28px; }\n.cf-body:not(.pr-body) .db-more svg{ width:12px; height:12px; }\n.cf-body:not(.pr-body) .db-readout h4{ font-size:24px; }\n.cf-body:not(.pr-body) .db-readout p{ font-size:16px; line-height:1.42; }\n\n.vrow{ transition:color .3s, text-shadow .3s; }\n.vrow.is-active{ color:#fff !important; text-shadow:0 0 10px rgba(125,255,174,.9); }\n.vrow.is-active .vk{ color:#c8ffde !important; }\n.keycap{ transition:box-shadow .3s; }\n\n/* Prensa: tablero de la prensa grande + movimientos chicos */\n.pr-body{ top:356px !important; }\n.pr-body .cf-panelcol{ justify-content:flex-start; gap:14px; padding-top:2px; }\n.pr-body .db-panel{ width:100%; display:flex; flex-direction:column; align-items:center; gap:14px; }\n.pr-body .tq-press{ width:100%; max-width:1180px; margin:0 auto; padding:18px; }\n.pr-body .tq-stand svg{ width:150px; }\n.pr-body .tq-box{ padding:24px 16px 16px; gap:14px; }\n.pr-body .tq-lab{ font-size:14px; }\n.pr-gz{ width:100%; max-width:1180px; margin:0 auto; padding:16px 22px; }\n.gz-box{ transition:opacity e] .steps .step:nth-child(7){ animation-delay:.50s; }\n}\n@keyframes rise{ from{ opacity:0; transform:translateY(22px); } to{ opacity:1; transform:none; } }\n<\u002Fstyle>\n<style>/* panel.css — schematic control-panel styling, scaled by --s (panel width).\n   Three themes: .theme-paper (museum placard), .theme-blueprint, .theme-bold. */\n\n.panel { --s: 520px; width: var(--s); position: relative; }\n.panel-face {\n  position: relative; width: var(--s); height: var(--s);\n  border-radius: calc(var(--s) * 0.012);\n}\n\n/* ---- cabinet faces per theme ---- */\n.theme-paper .panel-face {\n  background:\n    linear-gradient(180deg, #fbfbf9, #eceae3);\n  border: calc(var(--s)*0.006) solid #d8d4c8;\n  box-shadow: inset 0 calc(var(--s)*0.01) calc(var(--s)*0.03) rgba(255,255,255,.7),\n              0 calc(var(--s)*0.02) calc(var(--s)*0.05) rgba(40,38,30,.12);\n}\n.theme-blueprint .panel-face {\n  background: transparent;\n  border: calc(var(--s)*0.004) solid rgba(150,200,255,.55);\n}\n.theme-bold .panel-face {\n  background: linear-gradient(180deg,#2b2b30,#16161a);\n  border: calc(var(--s)*0.006) solid #000;\n  box-shadow: inset 0 0 calc(var(--s)*0.04) rgba(0,0,0,.6);\n}\n\n/* locks & hinges */\n.lock { position:absolute; left:5.5%; width:calc(var(--s)*0.035); height:calc(var(--s)*0.035);\n  border-radius:50%; transform:translate(-50%,-50%); }\n.lock-tl { top:13%; } .lock-bl { top:88%; }\n.hinge { position:absolute; right:1.5%; width:calc(var(--s)*0.014); height:calc(var(--s)*0.05); transform:translateY(-50%); border-radius:2px; }\n.hinge-t { top:24%; } .hinge-b { top:80%; }\n.theme-paper .lock { background:radial-gradient(circle at 40% 35%,#cfcabb,#8a8676); box-shadow:inset 0 0 0 calc(var(--s)*0.004) #b6b1a3; }\n.theme-paper .hinge { background:#cbc6ba; }\n.theme-blueprint .lock { background:transparent; border:calc(var(--s)*0.0035) solid rgba(150,200,255,.5); }\n.theme-blueprint .hinge { background:rgba(150,200,255,.4); }\n.theme-bold .lock { background:radial-gradient(circle at 40% 35%,#555,#222); }\n.theme-bold .hinge { background:#444; }\n\n/* ---- generic control wrapper ---- */\n.ctrl { position:absolute; transform:translate(-50%,-50%);\n  display:flex; flex-direction:column; align-items:center; gap:calc(var(--s)*0.012); }\n.panel-face > .ctrl { /* positioned via inline left/top */ }\n\n/* label tab (white plate above control, like the photo) */\n.ctrl-tab {\n  font:600 calc(var(--s)*0.019)/1 'Barlow Condensed', 'Arial Narrow', sans-serif;\n  letter-spacing:.04em; padding:calc(var(--s)*0.006) calc(var(--s)*0.012);\n  border-radius:2px; white-space:nowrap; order:-1;\n}\n.theme-paper .ctrl-tab { background:#fff; color:#2a2a28; border:1px solid #d6d2c6; box-shadow:0 1px 2px rgba(0,0,0,.08); }\n.theme-blueprint .ctrl-tab { background:rgba(10,30,70,.6); color:#dcebff; color:#d9e8ff; border:1px solid rgba(150,200,255,.45); }\n.theme-bold .ctrl-tab { background:#0d0d10; color:#f3f3f0; border:1px solid #3a3a40; }\n\n/* numbered callout badge */\n.ctrl-badge {\n  position:absolute; top:calc(var(--s)*-0.018); right:calc(var(--s)*-0.03);\n  width:calc(var(--s)*0.05); height:calc(var(--s)*0.05); border-radius:50%;\n  display:flex; align-items:center; justify-content:center;\n  font:800 calc(var(--s)*0.028)/1 'Barlow', sans-serif; z-index:5;\n}\n.theme-paper .ctrl-badge { background:#1A4088; color:#fff; box-shadow:0 2px 5px rgba(26,64,136,.45); }\n.theme-blueprint .ctrl-badge { background:#0a1f46; color:#9fd0ff; border:calc(var(--s)*0.004) solid #9fd0ff; }\n.theme-bold .ctrl-badge { background:#ffd400; color:#111; }\n\n/* ---- E-STOP ---- */\n.ctrl-estop .estop-ring {\n  width:calc(var(--s)*0.165); height:calc(var(--s)*0.165); border-radius:50%;\n  display:flex; align-items:center; justify-content:center;\n}\n.theme-paper .estop-ring { background:radial-gradient(circle at 50% 45%,#ffd83a,#e3b400); box-shadow:0 calc(var(--s)*0.006) calc(var(--s)*0.012) rgba(0,0,0,.18); }\n.theme-blueprint .estop-ring { background:transparent; border:calc(var(--s)*0.004) solid #ffd83a; }\n.theme-bold .estop-ring { background:radial-gradient(circle at 50% 45%,#ffd83a,#caa000); }\n.estop-dome { width:62%; height:62%; border-radius:50%; position:relative;\n  display:flex; align-items:center; justify-content:center; }\n.theme-paper .estop-dome, .theme-bold .estop-dome { background:radial-gradient(circle at 38% 30%,#ff5a4d,#b1271c 70%); box-shadow:inset 0 calc(var(--s)*0.004) calc(var(--s)*0.006) rgba(255,255,255,.4); }\n.theme-blueprint .estop-dome { background:transparent; border:calc(var(--s)*0.004) solid #ff7a6e; }\n.estop-x { position:absolute; inset:0; }\n\n/* ---- indicator light ---- */\n.ctrl-light .lens { width:calc(var(--s)*0.085); height:calc(var(--s)*0.085); border-radius:50%;\n  position:relative; display:flex; align-items:center; justify-content:center; }\n.theme-paper .ctrl-light .lens, .theme-bold .ctrl-light .lens { box-shadow:inset 0 0 0 calc(var(--s)*0.008) rgba(0,0,0,.25); }\n.theme-blueprint .ctrl-light .lens { border:calc(var(--s)*0.0035) solid rgba(150,200,255,.6); }\n.c-green .lens { background:radial-gradient(circle at 40% 32%,#1c5a2c,#0c3318); }\n.c-red .lens   { background:radial-gradient(circle at 40% 32%,#7a201a,#3c0f0c); }\n.c-amber .lens { background:radial-gradient(circle at 40% 32%,#8a5a10,#3f2906); }\n.lit.c-red .lens { background:radial-gradient(circle at 42% 35%,#ff6b5c,#d62b1c 70%); box-shadow:0 0 calc(var(--s)*0.03) rgba(255,70,50,.7), inset 0 0 calc(var(--s)*0.01) rgba(255,255,255,.5); }\n.lit.c-green .lens { background:radial-gradient(circle at 42% 35%,#62e08a,#16a34a 70%); box-shadow:0 0 calc(var(--s)*0.03) rgba(40,210,110,.7); }\n.lit.c-amber .lens { background:radial-gradient(circle at 42% 35%,#ffc24d,#e0890f 70%); box-shadow:0 0 calc(var(--s)*0.03) rgba(255,170,30,.7); }\n.theme-blueprint .ctrl-light .lens { background:transparent; }\n.theme-blueprint .c-green .lens { border-color:#7be0a0; }\n.theme-blueprint .c-red .lens { border-color:#ff9a8e; }\n.theme-blueprint .c-amber .lens
