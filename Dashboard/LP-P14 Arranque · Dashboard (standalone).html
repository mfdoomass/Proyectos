rint .knob-pointer { background:#9fd0ff; }\n\n/* ---- speed dial ---- */\n.ctrl-dial .dial-bezel { width:calc(var(--s)*0.135); height:calc(var(--s)*0.135);\n  border-radius:calc(var(--s)*0.01); display:flex; align-items:center; justify-content:center; }\n.theme-paper .dial-bezel, .theme-bold .dial-bezel { background:linear-gradient(180deg,#dcd9cf,#bdb9ad); box-shadow:inset 0 0 0 calc(var(--s)*0.003) #a9a597; }\n.theme-blueprint .dial-bezel { background:transparent; border:calc(var(--s)*0.004) solid rgba(150,200,255,.5); }\n.dial-face { width:78%; height:78%; border-radius:50%; position:relative;\n  display:flex; align-items:center; justify-content:center; }\n.theme-paper .dial-face, .theme-bold .dial-face { background:radial-gradient(circle at 45% 35%,#2c2c2c,#0c0c0c); }\n.theme-blueprint .dial-face { background:transparent; border:calc(var(--s)*0.0035) solid rgba(150,200,255,.55); }\n.dial-tick { position:absolute; left:50%; top:50%; width:calc(var(--s)*0.004); height:calc(var(--s)*0.012);\n  transform-origin:50% 0; }\n.theme-paper .dial-tick, .theme-bold .dial-tick { background:rgba(255,255,255,.6); }\n.theme-blueprint .dial-tick { background:rgba(150,200,255,.6); }\n.dial-knob { position:absolute; left:50%; top:50%; width:46%; height:46%; border-radius:50%;\n  transform:translate(-50%,-50%); }\n.theme-paper .dial-knob, .theme-bold .dial-knob { background:radial-gradient(circle at 45% 35%,#4a4a4a,#161616); }\n.theme-blueprint .dial-knob { background:transparent; border:calc(var(--s)*0.0035) solid rgba(150,200,255,.5); }\n.dial-pointer { position:absolute; left:50%; top:50%; width:calc(var(--s)*0.008); height:calc(var(--s)*0.04);\n  border-radius:2px; transform-origin:50% 100%; z-index:2; }\n.theme-paper .dial-pointer, .theme-bold .dial-pointer { background:#ffd400; }\n.theme-blueprint .dial-pointer { background:#ffd83a; }\n\n/* ---- VFD display ---- */\n.ctrl-vfd .vfd { width:calc(var(--s)*0.155); border-radius:calc(var(--s)*0.008);\n  padding:calc(var(--s)*0.008); display:flex; flex-direction:column; gap:calc(var(--s)*0.006); }\n.theme-paper .vfd, .theme-bold .vfd { background:linear-gradient(180deg,#e7e4da,#cbc7ba); box-shadow:inset 0 0 0 calc(var(--s)*0.003) #b3afa1; }\n.theme-blueprint .vfd { background:transparent; border:calc(var(--s)*0.004) solid rgba(150,200,255,.5); }\n.vfd-screen { height:calc(var(--s)*0.06); border-radius:2px; position:relative;\n  display:flex; align-items:center; padding:0 calc(var(--s)*0.008); }\n.theme-paper .vfd-screen, .theme-bold .vfd-screen { background:linear-gradient(180deg,#b9c9a6,#9fb389); box-shadow:inset 0 0 calc(var(--s)*0.01) rgba(0,0,0,.25); }\n.theme-blueprint .vfd-screen { background:transparent; border:calc(var(--s)*0.0035) solid rgba(150,200,255,.45); }\n.vfd-hz { font:800 calc(var(--s)*0.026)/1 'Barlow', monospace; color:#1f3010; }\n.theme-blueprint .vfd-hz { color:#9fd0ff; }\n.vfd-hz em { font-style:normal; font-size:.6em; }\n.vfd-keys { display:flex; align-items:center; gap:calc(var(--s)*0.006); }\n.vfd-dpad { width:calc(var(--s)*0.028); height:calc(var(--s)*0.028); border-radius:50%; }\n.theme-paper .vfd-dpad, .theme-bold .vfd-dpad { background:radial-gradient(circle at 45% 35%,#cfccc0,#a7a395); }\n.theme-blueprint .vfd-dpad { border:calc(var(--s)*0.0035) solid rgba(150,200,255,.5); }\n.vfd-soft { font:700 calc(var(--s)*0.013)/1 'Barlow', sans-serif; color:#5a564a; letter-spacing:.03em; }\n.theme-blueprint .vfd-soft { color:rgba(150,200,255,.7); }\n\n/* ---- off-panel action glyphs (oil valve / air release) ---- */\n.ctrl-oil .og, .ctrl-air .og { width:calc(var(--s)*0.15); height:calc(var(--s)*0.15); display:block; }\n\n/* focus state — single control shown big in step chips */\n.ctrl.focus { transform:none; }\n.ctrl-inline { position:relative !important; left:auto !important; top:auto !important; transform:none !important; }\n<\u002Fstyle>\n<style>/* programa.css — styles specific to the Tablero de Programación ficha.\n   Reuses the placard/blueprint shells from posters.css; adds the ais III\n   keypad, VFD, program table, process-flow and poka-yoke blocks.\n   Accent tokens shared across table headers + key tones. */\n\n:root {\n  --c-navy:#1A4088; --c-green:#1c7a3f; --c-red:#b1271c;\n  --c-amber:#b9831a; --c-plum:#6b4a9e; --c-sky:#2f6fb0; --c-mute:#8a8472;\n}\n\n/* ===================================================== INTRO (qué es) === */\n.pg-intro { display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:start;\n  margin:26px 0 4px; padding:18px 22px; background:rgba(26,64,136,.045);\n  border-left:4px solid var(--c-navy); border-radius:3px; }\n.pg-intro-k { font:800 13px/1.1 'Barlow Condensed',sans-serif; letter-spacing:.18em;\n  color:var(--c-navy); writing-mode:horizontal-tb; padding-top:3px; white-space:nowrap; }\n.pg-intro p { margin:0; font:400 18px/1.5 'Barlow',sans-serif; color:#46412f; text-wrap:pretty; }\n.pg-intro em { font-style:italic; color:var(--c-navy); font-weight:600; }\n\n/* ===================================================== KEYPAD (ais III) === */\n.keypad { --s:460px; width:var(--s); }\n.kp-face { width:100%; padding:calc(var(--s)*0.045); border-radius:calc(var(--s)*0.02);\n  display:flex; flex-direction:column; gap:calc(var(--s)*0.03); }\n.theme-paper .kp-face { background:linear-gradient(180deg,#f6f3ea,#e9e5d8);\n  border:calc(var(--s)*0.006) solid #d3cebf;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 calc(var(--s)*0.02) calc(var(--s)*0.05) rgba(40,38,30,.12); }\n.theme-blueprint .kp-face { background:transparent; border:calc(var(--s)*0.004) solid rgba(150,200,255,.5); }\n\n.kp-brandrow { display:flex; align-items:baseline; justify-content:space-between; padding:0 calc(var(--s)*0.01); }\n.kp-brand { font:800 calc(var(--s)*0.05)/1 'Archivo',sans-serif; color:#b22; letter-spacing:-.01em; }\n.kp-brand-iii { color:#b22; margin-left:.12em; font-size:.8em; }\n.theme-blueprint .kp-brand, .theme-blueprint .kp-brand-iii { color:#ff9a8e; }\n.kp-brand-sub { font:700 calc(var(--s)*0.018)/1 'Barlow Condensed',sans-serif; letter-spacing:.14em; color:var(--c-mute); }\n.theme-blueprint .kp-brand-sub { color:#8fb0e0; }\n\n/* ---- VFD display ---- */\n.vscreen { padding:calc(var(--s)*0.018); border-radius:calc(var(--s)*0.012); }\n.theme-paper .vscreen { background:linear-gradient(180deg,#2a2a26,#161613);\n  box-shadow:inset 0 0 0 calc(var(--s)*0.004) #000; }\n.theme-blueprint .vscreen { background:transparent; border:calc(var(--s)*0.004) solid rgba(150,200,255,.45); }\n.vscreen-glass { padding:calc(var(--s)*0.02) calc(var(--s)*0.024); border-radius:calc(var(--s)*0.008);\n  display:flex; flex-direction:column; gap:calc(var(--s)*0.012);\n  background:linear-gradient(180deg,#1d3a1e,#13290f); }\n.theme-blueprint .vscreen-glass { background:rgba(20,60,40,.25); }\n.vrow { display:flex; align-items:baseline; gap:calc(var(--s)*0.018);\n  font-family:'JetBrains Mono',monospace; color:#7dffae; line-height:1;\n  text-shadow:0 0 calc(var(--s)*0.01) rgba(80,255,150,.5); }\n.vk { font-weight:600; font-size:calc(var(--s)*0.026); letter-spacing:.04em; min-width:calc(var(--s)*0.28); color:#5fd98c; }\n.vv { font-weight:800; font-size:calc(var(--s)*0.034); letter-spacing:.06em; }\n.vmode, .vunit { font-weight:600; font-size:calc(var(--s)*0.022); color:#5fd98c; margin-left:auto; }\n\n/* ---- keypad grid ---- */\n.kp-grid { display:grid; grid-template-columns:repeat(5,1fr);\n  gap:calc(var(--s)*0.018); grid-auto-rows:calc(var(--s)*0.125); }\n.keycap { position:relative; border-radius:calc(var(--s)*0.012);\n  display:flex; align-items:center; justify-content:center; text-align:center;\n  padding:calc(var(--s)*0.004); }\n.theme-paper .keycap { background:linear-gradient(180deg,#fff,#efece3);\n  border:calc(var(--s)*0.0035) solid #d4cfc1;\n  box-shadow:0 calc(var(--s)*0.003) calc(var(--s)*0.006) rgba(0,0,0,.12); }\n.theme-blueprint .keycap { background:transparent; border:calc(var(--s)*0.0035) solid rgba(150,200,255,.4); }\n.kc-label { display:flex; flex-direction:column; align-items:center; gap:0;\n  font:800 calc(var(--s)*0.026)/1.02 'Barlow Condensed',sans-serif; letter-spacing:.01em; color:#33312a; }\n.theme-blueprint .kc-label { color:#dce8fb; }\n.kc-line { display:block; }\n\n/* function-key tones — colored label + colored top hairline */\n.keycap.kc-green .kc-label { color:var(--c-green); }\n.keycap.kc-red .kc-label { color:var(--c-red); }\n.keycap.kc-amber .kc-label { color:var(--c-amber); }\n.keycap.kc-plum .kc-label { color:var(--c-plum); }\n.keycap.kc-sky .kc-label { color:var(--c-sky); }\n.theme-paper .keycap.kc-green { border-top:calc(var(--s)*0.008) solid var(--c-green); }\n.theme-paper .keycap.kc-red { border-top:calc(var(--s)*0.008) solid var(--c-red); }\n.theme-paper .keycap.kc-amber { border-top:calc(var(--s)*0.008) solid var(--c-amber); }\n.theme-paper .keycap.kc-plum { border-top:calc(var(--s)*0.008) solid var(--c-plum); }\n.theme-paper .keycap.kc-sky { border-top:calc(var(--s)*0.008) solid var(--c-sky); }\n\n/* highlighted (key) keys — navy ring + badge */\n.theme-paper .keycap.kc-lit { box-shadow:0 0 0 calc(var(--s)*0.006) var(--c-navy),\n  0 calc(var(--s)*0.006) calc(var(--s)*0.014) rgba(26,64,136,.3); }\n.theme-blueprint .keycap.kc-lit { box-shadow:0 0 0 calc(var(--s)*0.006) #7fc3ff; border-color:#7fc3ff; }\n.kc-badge { position:absolute; top:calc(var(--s)*-0.022); right:calc(var(--s)*-0.022);\n  width:calc(var(--s)*0.05); height:calc(var(--s)*0.05); border-radius:50%;\n  display:flex; align-items:center; justify-content:center;\n  font:800 calc(var(--s)*0.028)/1 'Barlow',sans-serif; z-index:3; }\n.theme-paper .kc-badge { background:var(--c-navy); color:#fff; box-shadow:0 2px 5px rgba(26,64,136,.45); }\n.theme-blueprint .kc-badge { background:#0a1f46; color:#9fd0ff; border:calc(var(--s)*0.004) solid #9fd0ff; }\n\n/* big single key for chips */\n.keycap.kc-big { width:96px; height:58px; }\n\n/* ---- key legend (the 6 key keys) ---- */\n.keylist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:13px; }\n.keylist li { display:flex; align-items:center; gap:14px; }\n.keylist .kl-n { flex:none; width:30px; height:30px; border-radius:7px; background:var(--c-navy);\n  color:#fff; font:800 16px/30px 'Barlow',sans-serif; text-align:center; }\n.keylist .kl-name { font:600 17px/1.2 'Barlow',sans-serif; color:#33312a; }\n.keylist .kl-name b { font:800 17px/1.2 'Barlow Condensed',sans-serif; letter-spacing:.03em;\n  color:var(--c-navy); margin-right:7px; }\n.blueprint .keylist .kl-n { background:transparent; border:1.5px solid #7fc3ff; color:#7fc3ff;\n  border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:27px; }\n.blueprint .keylist .kl-name { color:#dce8fb; font-family:'Barlow Semi Condensed',sans-serif; }\n.blueprint .keylist .kl-name b { color:#7fc3ff; }\n\n/* key-chip used in step rows */\n.pf-keychip { display:flex; flex-direction:column; align-items:center; gap:8px; width:118px; }\n.pf-keychip .pfk-cap { font:800 17px/1.05 'Barlow Condensed',sans-serif; letter-spacing:.02em;\n  color:#fff; background:var(--c-navy); border-radius:6px; padding:9px 12px; text-align:center;\n  min-width:74px; white-space:nowrap; }\n.pf-keychip.tone-green .pfk-cap { background:var(--c-green); }\n.pf-keychip.tone-red .pfk-cap { background:var(--c-red); }\n.pf-keychip.tone-sky .pfk-cap { background:var(--c-sky); }\n.pf-keychip.tone-plum .pfk-cap { background:var(--c-plum); }\n.pf-keychip.tone-flat .pfk-cap { background:#fff; color:var(--c-navy); border:2px solid var(--c-navy); }\n.pf-keychip .pfk-sub { font:700 12px/1 'Barlow Condensed',sans-serif; letter-spacing:.1em; color:var(--c-mute); text-transform:uppercase; }\n.blueprint .pf-keychip .pfk-sub { color:#7f9ccb; }\n\n/* ===================================================== PROGRAM TABLE === */\n.ptable { width:100%; border-collapse:collapse; font-family:'Barlow',sans-serif; }\n.ptable thead th { text-align:center; padding:11px 10px 9px; vertical-align:bottom;\n  border-bottom:2.5px solid var(--c-navy); }\n.pth-head { display:block; font:800 16px/1 'Barlow Condensed',sans-serif; letter-spacing:.04em; color:#33312a; }\n.pth-sub { display:block; font:600 11px/1.1 'Barlow',sans-serif; color:var(--c-mute); margin-top:4px; }\n.ptable thead th.is-key { background:rgba(28,122,63,.1); border-bottom-color:var(--c-green); border-radius:5px 5px 0 0; }\n.ptable thead th.is-key .pth-head { color:var(--c-green); }\n.ptable thead th.is-key .pth-sub { color:var(--c-green); font-weight:800; letter-spacing:.06em; }\n.ptable tbody td { text-align:center; padding:13px 10px; font:600 19px/1 'Barlow',sans-serif;\n  color:#33312a; border-bottom:1px solid #e2dccc; font-variant-numeric:tabular-nums; }\n.ptable tbody tr:last-child td { border-bottom:none; }\n.ptable tbody td.is-key { background:rgba(28,122,63,.07); }\n.td-prog { font:800 22px/1 'Barlow Condensed',sans-serif; color:var(--c-navy); }\n.td-largo { font:800 22px/1 'Barlow Condensed',sans-serif; color:var(--c-green); }\n.td-largo small, .td-long small { font-size:.6em; font-weight:700; color:var(--c-mute); margin-left:2px; }\n.td-ver { font:600 14px/1 'JetBrains Mono',monospace; color:var(--c-mute); }\n.td-mute { color:var(--c-mute); }\n\n.ptable-note { display:flex; align-items:center; gap:10px; margin-top:12px;\n  font:italic 600 14px/1.3 'Spectral',serif; color:var(--c-green); }\n.ptable-note::before { content:'↑'; font:800 18px/1 'Barlow',sans-serif; color:var(--c-green); }\n\n/* blueprint table overrides */\n.blueprint .ptable thead th { border-bottom-color:#7fc3ff; }\n.blueprint .pth-head { color:#eaf2ff; }\n.blueprint .pth-sub { color:#7f9ccb; }\n.blueprint .ptable thead th.is-key { background:rgba(120,255,180,.1); border-bottom-color:#7be0a0; }\n.blueprint .ptable thead th.is-key .pth-head, .blueprint .ptable thead th.is-key .pth-sub { color:#7be0a0; }\n.blueprint .ptable tbody td { color:#cfe0f7; border-bottom-color:rgba(150,200,255,.16); font-family:'JetBrains Mono',monospace; font-weight:400; }\n.blueprint .ptable tbody td.is-key { background:rgba(120,255,180,.06); }\n.blueprint .td-prog { color:#9fd0ff; }\n.blueprint .td-largo { color:#7be0a0; }\n.blueprint .ptable-note { color:#7be0a0; }\n.blueprint .ptable-note::before { color:#7be0a0; }\n\n/* ===================================================== PROCESS FLOW === */\n.pflow { width:100%; }\n.pf-stations { display:flex; align-items:stretch; gap:8px; }\n.pf-station { flex:1; display:flex; flex-direction:column; align-items:center; gap:12px;\n  padding:18px 14px; border:1.5px solid #e0dac9; border-radius:8px; background:rgba(255,255,255,.5); }\n.blueprint .pf-station { border:1px dashed rgba(150,200,255,.35); background:transparent; }\n.pf-tag { display:flex; align-items:center; gap:8px; font:800 15px/1 'Barlow Condensed',sans-serif;\n  letter-spacing:.12em; color:#33312a; }\n.pf-tag b { display:flex; align-items:center; justify-content:center; width:23px; height:23px;\n  border-radius:50%; background:var(--c-navy); color:#fff; font:800 14px/1 'Barlow',sans-serif; }\n.blueprint .pf-tag { color:#eaf2ff; }\n.blueprint .pf-tag b { background:transparent; border:1.5px solid #7fc3ff; color:#7fc3ff; }\n.pf-art { width:120px; height:110px; color:var(--c-navy); display:flex; }\n.blueprint .pf-art { color:#9fd0ff; }\n.pf-art svg { width:120px; height:110px; }\n.pf-count { font:800 13px/1 'Barlow Condensed',sans-serif; letter-spacing:.06em; color:var(--c-green);\n  background:rgba(28,122,63,.1); padding:5px 10px; border-radius:20px; }\n.blueprint .pf-count { color:#7be0a0; background:rgba(120,255,180,.08); }\n.pf-cap { margin:0; font:400 14px/1.35 'Barlow',sans-serif; color:#55503f; text-align:center; text-wrap:pretty; }\n.blueprint .pf-cap { color:#a6c0e6; font-family:'Barlow Semi Condensed',sans-serif; }\n.pf-arrow { align-self:center; color:#bdb6a3; flex:none; width:44px; }\n.blueprint .pf-arrow { color:rgba(150,200,255,.5); }\n.pf-arrow svg { width:44px; height:20px; }\n\n/* ===================================================== POKA-YOKE === */\n.pokayoke { display:grid; grid-template-columns:1fr 1fr; gap:18px; }\n.poka { display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start;\n  padding:20px 22px; border-radius:8px; }\n.poka-stop { background:#fdecea; border:2px solid var(--c-red); }\n.poka-units { background:#fff5e6; border:2px solid var(--c-amber); }\n.blueprint .poka-stop { background:rgba(177,39,28,.12); border-color:#ff7a6e; }\n.blueprint .poka-units { background:rgba(185,131,26,.12); border-color:#e0a23f; }\n.poka-mark { flex:none; width:46px; height:46px; border-radius:50%; display:flex;\n  align-items:center; justify-content:center; font:800 26px/1 'Barlow',sans-serif; color:#fff; }\n.poka-stop .poka-mark { background:var(--c-red); }\n.poka-units .poka-mark { background:var(--c-amber); }\n.poka-big { font:800 21px/1.12 'Spectral',serif; margin:0 0 6px; color:#26241e; }\n.poka-units .poka-big { color:#26241e; }\n.blueprint .poka-big { color:#eaf2ff; font-family:'Barlow Condensed',sans-serif; }\n.poka-txt { margin:0; font:400 15px/1.4 'Barlow',sans-serif; color:#55503f; text-wrap:pretty; }\n.blueprint .poka-txt { color:#c4d3ec; font-family:'Barlow Semi Condensed',sans-serif; }\n\n/* ===================================================== STOP / FIELDS === */\n.pg-stop { background:#fdf6ec; border:2px solid #e0890f; border-radius:7px; padding:20px 22px; }\n.blueprint .pg-stop { background:rgba(224,162,63,.09); border:1.5px solid #e0a23f; border-radius:4px; }\n.pg-stop-head { display:flex; align-items:center; gap:11px; font:800 17px/1 'Barlow Condensed',sans-serif;\n  letter-spacing:.14em; color:#b1271c; margin-bottom:14px; }\n.blueprint .pg-stop-head { color:#ffce80; }\n.pg-stop-icon { flex:none; width:25px; height:25px; border-radius:50%; background:#b1271c; color:#fff;\n  font:800 16px/25px 'Barlow',sans-serif; text-align:center; }\n.blueprint .pg-stop-icon { background:#e0890f; }\n.pg-stop ul { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:9px; }\n.pg-stop li { font:500 14px/1.35 'Barlow',sans-serif; color:#55503f; }\n.blueprint .pg-stop li { color:#c4d3ec; font-family:'Barlow Semi Condensed',sans-serif; }\n\n.pg-fields h4 { font:700 19px/1 'Spectral',serif; margin:0 0 14px; color:#26241e; }\n.blueprint .pg-fields h4 { color:#eaf2ff; font-family:'Barlow Condensed',sans-serif; }\n.pg-fields dl { margin:0; display:flex; flex-direction:column; gap:11px; }\n.pg-field { display:flex; align-items:baseline; gap:14px; }\n.pg-field dt { flex:none; min-width:128px; font:800 14px/1.1 'JetBrains Mono',monospace;\n  letter-spacing:.02em; color:var(--c-green); }\n.pg-field dd { margin:0; font:400 15px/1.3 'Barlow',sans-serif; color:#55503f; }\n.blueprint .pg-field dt { color:#7be0a0; }\n.blueprint .pg-field dd { color:#a6c0e6; font-family:'Barlow Semi Condensed',sans-serif; }\n\n/* keypad caption under hero */\n.pg-panel { display:flex; flex-direction:column; align-items:center; gap:16px; }\n.pg-panel-cap { font:italic 600 16px/1 'Spectral',serif; color:#8a8472; text-align:center; }\n.blueprint .pg-panel-cap { color:#8fb0e0; font-family:'JetBrains Mono',monospace; font-style:normal; font-size:12px; letter-spacing:.08em; }\n<\u002Fstyle>\n<style>/* troquel.css — styles for the Troquelado y Corte instructive.\n   Reuses the .placard / .blueprint shells from posters.css and the\n   .pg-intro / .pokayoke / .pg-stop blocks + color tokens from programa.css.\n   Adds: control glyphs, step chips, control legend, press diagram,\n   right-knob direction guide and guillotine start flow. */\n\n/* ============================================================ GLYPHS === */\n.tq-g { position:relative; display:inline-flex; align-items:center; justify-content:center;\n  width:46px; height:46px; flex:none; }\n\n/* round push-buttons */\n.tq-g-btn { border-radius:50%; }\n.tq-g-btn .tq-cap { width:40px; height:40px; border-radius:50%;\n  box-shadow:inset 0 2px 3px rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.3); }\n.tq-green .tq-cap { background:radial-gradient(circle at 38% 32%, #4bbf6b, #1c7a3f 70%); }\n.tq-black .tq-cap { background:radial-gradient(circle at 38% 32%, #4a4a52, #16161a 72%); }\n.tq-red   .tq-cap { background:radial-gradient(circle at 38% 32%, #e0584c, #b1271c 70%); }\n.tq-cap-txt { width:40px; height:40px; border-radius:50%; display:flex; align-items:center;\n  justify-content:center; font:800 24px/1 'Barlow',sans-serif; color:#fff;\n  background:radial-gradient(circle at 38% 32%, #4a4a52, #16161a 72%);\n  box-shadow:inset 0 2px 3px rgba(255,255,255,.25), inset 0 -3px 5px rgba(0,0,0,.32); }\n\n/* double button (RAM DOWN, two hands) */\n.tq-g-btn.tq-dbl { width:78px; }\n.tq-cap2 { position:absolute; right:-2px; top:0; }\n.tq-g-btn.tq-dbl > .tq-cap { position:absolute; left:-2px; top:0; }\n\n/* emergency stop */\n.tq-g-estop { width:50px; height:50px; }\n.tq-dome { width:46px; height:46px; border-radius:50%;\n  background:radial-gradient(circle at 40% 32%, #e0584c, #b1271c 68%);\n  border:3px solid #f2c200; display:flex; align-items:center; justify-content:center;\n  box-shadow:inset 0 -3px 6px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3); }\n.tq-dome-x { width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.85); }\n\n/* knob (rotary selector) */\n.tq-g-knob { width:50px; height:50px; }\n.tq-knob-face { position:relative; width:46px; height:46px; border-radius:50%;\n  background:radial-gradient(circle at 40% 34%, #d8d4c8, #9a9788 78%);\n  border:2px solid #6f6c60; box-shadow:inset 0 2px 4px rgba(255,255,255,.4), 0 1px 2px rgba(0,0,0,.3); }\n.tq-ptr { position:absolute; left:50%; top:50%; width:4px; height:21px; border-radius:2px;\n  background:#26241e; transform-origin:50% 100%; }\n.tq-tick { position:absolute; width:3px; height:6px; background:#6f6c60; left:50%; top:2px;\n  transform-origin:50% 21px; border-radius:2px; }\n.tq-tick-c { transform:translateX(-50%); }\n.tq-tick-l { transform:translateX(-50%) rotate(-52deg); }\n.tq-tick-r { transform:translateX(-50%) rotate(52deg); }\n\n/* O / I split button (Siemens box) */\n.tq-g-oi { width:40px; height:52px; flex-direction:column; border-radius:6px; overflow:hidden;\n  border:2px solid #3a3a40; box-shadow:0 1px 2px rgba(0,0,0,.3); }\n.tq-oi-o, .tq-oi-i { flex:1; width:100%; display:flex; align-items:center; justify-content:center;\n  font:800 18px/1 'Barlow',sans-serif; color:#fff; }\n.tq-oi-o { background:#b1271c; }\n.tq-oi-i { background:#1c7a3f; }\n\n/* lever / toggle */\n.tq-g-lever { width:46px; height:50px; }\n.tq-lever-track { position:relative; width:26px; height:40px; border-radius:13px;\n  background:linear-gradient(#cfcabc, #a8a496); border:2px solid #6f6c60; }\n.tq-lever-stick { position:absolute; left:50%; top:3px; transform:translateX(-50%);\n  width:12px; height:20px; border-radius:6px;\n  background:linear-gradient(#3a3a40, #16161a); box-shadow:0 2px 3px rgba(0,0,0,.4); }\n\n/* ===================================================== STEP CHIPS === */\n.tq-chip { display:flex; flex-direction:column; align-items:center; gap:9px; width:132px; }\n.tq-chip-glyph { height:64px; display:flex; align-items:center; justify-content:center; }\n.tq-keycap { min-width:46px; height:46px; padding:0 10px; border-radius:9px;\n  background:#16161a; color:#fff; font:800 26px/46px 'Barlow Condensed',sans-serif; text-align:center; }\n.tq-chip-meta { display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; }\n.tq-chip-label { font:700 11px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; color:#8a8472; }\n.tq-chip-sub { font:800 17px/1.05 'Barlow Condensed',sans-serif; letter-spacing:.03em; color:#1A4088; }\n.tq-chip.tone-green .tq-chip-sub { color:var(--c-green); }\n.tq-chip.tone-red   .tq-chip-sub { color:var(--c-red); }\n.tq-chip.tone-sky   .tq-chip-sub { color:var(--c-sky); }\n.tq-chip.tone-plum  .tq-chip-sub { color:var(--c-plum); }\n.tq-chip.tone-navy  .tq-chip-sub { color:var(--c-navy); }\n.tq-chip.tone-flat  .tq-chip-sub { color:#55503f; }\n\n/* ===================================================== CONTROL LEGEND === */\n.tq-legend { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:13px; }\n.tq-legend.cols2 { display:grid; grid-template-columns:1fr 1fr; gap:14px 36px; }\n.tq-legend li { display:flex; align-items:flex-start; gap:14px; }\n.tq-legend-n { flex:none; width:30px; height:30px; border-radius:50%; background:var(--c-navy);\n  color:#fff; font:800 16px/30px 'Barlow',sans-serif; text-align:center; }\n.tq-legend-name { font:500 16px/1.32 'Barlow',sans-serif; color:#55503f; padding-top:2px; }\n.tq-legend-name b { display:block; font:800 17px/1.2 'Barlow Condensed',sans-serif;\n  letter-spacing:.03em; color:#1A4088; margin-bottom:1px; }\n\n/* ===================================================== PRESS DIAGRAM === */\n.tq-press { display:grid; grid-template-columns:1fr auto 1fr; gap:20px; align-items:start;\n  padding:24px; background:rgba(26,64,136,.045); border-radius:10px; }\n.tq-box { background:linear-gradient(#e7e3d6,#d7d2c2); border:2px solid #b6b09c; border-radius:8px;\n  padding:30px 14px 16px; position:relative; display:flex; flex-direction:column; gap:14px;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.6); }\n.tq-box-tag { position:absolute; top:8px; left:50%; transform:translateX(-50%); white-space:nowrap;\n  font:800 11px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; color:#8a8472; }\n.tq-ctrl { display:grid; grid-template-columns:26px 56px 1fr; align-items:center; gap:10px; }\n.tq-badge { width:24px; height:24px; border-radius:50%; background:var(--c-navy); color:#fff;\n  font:800 13px/24px 'Barlow',sans-serif; text-align:center; }\n.tq-ctrl .tq-g { justify-self:center; }\n.tq-lab { font:800 13px/1.1 'Barlow Condensed',sans-serif; letter-spacing:.04em; color:#33312a; }\n\n.tq-stand { color:#1A4088; display:flex; flex-direction:column; align-items:center; gap:8px;\n  align-self:center; }\n.tq-stand svg { width:130px; height:auto; }\n.tq-stand-lab { font:800 10px/1 'Barlow Condensed',sans-serif; letter-spacing:.18em; color:#8a8472; }\n\n/* ===================================================== KNOB GUIDE === */\n.tq-knobguide { display:grid; grid-template-columns:170px 1fr; gap:28px; align-items:center;\n  padding:24px 26px; background:#fff; border:2px solid var(--c-navy); border-radius:10px; }\n.tq-kg-dial { position:relative; width:170px; height:120px; }\n.tq-kg-arc { position:absolute; left:50%; bottom:14px; width:5px; height:60px; border-radius:3px;\n  transform-origin:50% 100%; }\n.tq-kg-arc-l { transform:translateX(-50%) rotate(-52deg); background:var(--c-navy); }\n.tq-kg-arc-c { transform:translateX(-50%); background:#b6b09c; }\n.tq-kg-arc-r { transform:translateX(-50%) rotate(52deg); background:var(--c-sky); }\n.tq-kg-knob { position:absolute; left:50%; bottom:0; transform:translateX(-50%);\n  width:56px; height:56px; border-radius:50%;\n  background:radial-gradient(circle at 40% 34%, #d8d4c8, #9a9788 78%); border:2px solid #6f6c60;\n  box-shadow:inset 0 2px 4px rgba(255,255,255,.4); }\n.tq-kg-ptr { position:absolute; left:50%; top:50%; width:4px; height:25px; border-radius:2px;\n  background:#26241e; transform:translate(-50%,-100%); transform-origin:50% 100%; }\n.tq-kg-cap { position:absolute; font:800 11px/1 'Barlow Condensed',sans-serif; letter-spacing:.08em; }\n.tq-kg-cap-l { left:-6px; top:24px; color:var(--c-navy); }\n.tq-kg-cap-c { left:50%; top:-4px; transform:translateX(-50%); color:#8a8472; }\n.tq-kg-cap-r { right:-2px; top:24px; color:var(--c-sky); }\n.tq-kg-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }\n.tq-kg-list li { display:grid; grid-template-columns:120px 1fr; align-items:baseline; gap:14px;\n  padding-bottom:9px; border-bottom:1px solid #e2dccc; }\n.tq-kg-list li:last-child { border-bottom:none; padding-bottom:0; }\n.tq-kg-k { font:800 20px/1 'Barlow Condensed',sans-serif; letter-spacing:.04em; }\n.tq-kg-v { font:600 16px/1.25 'Barlow',sans-serif; color:#55503f; }\n.tq-kg-list li.tone-sky  .tq-kg-k { color:var(--c-sky); }\n.tq-kg-list li.tone-navy .tq-kg-k { color:var(--c-navy); }\n.tq-kg-list li.tone-flat .tq-kg-k { color:#8a8472; }\n\n/* ===================================================== GUILLOTINE FLOW === */\n.gz-flow { display:flex; flex-direction:column; gap:22px; }\n.gz-lights { padding:22px; background:rgba(28,122,63,.07); border:2px solid rgba(28,122,63,.4);\n  border-radius:10px; }\n.gz-lights-tag { display:block; font:800 12px/1 'Barlow Condensed',sans-serif; letter-spacing:.18em;\n  color:var(--c-green); margin-bottom:16px; }\n.gz-lights-row { display:flex; align-items:flex-start; justify-content:center; gap:6px; flex-wrap:wrap; }\n.gz-box { display:flex; flex-direction:column; align-items:center; gap:6px; width:150px; text-align:center; }\n.gz-num { width:26px; height:26px; border-radius:50%; background:var(--c-green); color:#fff;\n  font:800 14px/26px 'Barlow',sans-serif; }\n.gz-glyph { height:56px; display:flex; align-items:center; justify-content:center; }\n.gz-lab { font:800 15px/1.1 'Barlow Condensed',sans-serif; letter-spacing:.04em; color:#26241e; }\n.gz-sub { font:600 12px/1.25 'Barlow',sans-serif; color:#6b6655; }\n.gz-arrow { color:#1c7a3f; width:40px; display:flex; align-items:center; justify-content:center; padding-top:30px; }\n.gz-arrow svg { width:36px; height:18px; }\n\n.gz-cp { padding:20px 22px; background:#fff; border:2px solid var(--c-navy); border-radius:10px;\n  display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; gap:6px 22px; align-items:center; }\n.gz-cp-tag { grid-column:1 / -1; font:800 12px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; color:var(--c-navy); }\n.gz-cp-body { display:flex; align-items:center; gap:16px; }\n.gz-cp-screen { background:#11140f; border:3px solid #3a3a40; border-radius:6px; padding:9px 14px;\n  display:flex; flex-direction:column; gap:3px; min-width:108px; }\n.gz-cp-cp4 { font:700 10px/1 'JetBrains Mono',monospace; letter-spacing:.1em; color:#7f9c7f; }\n.gz-cp-readout { font:800 22px/1 'JetBrains Mono',monospace; color:#7CFC8A; letter-spacing:.06em; }\n.gz-cp-readout b { color:#aaffb4; }\n.gz-cp-keys { display:flex; gap:9px; }\n.gz-cp-plus, .gz-cp-confirm { width:42px; height:42px; border-radius:8px; display:flex;\n  align-items:center; justify-content:center; font:800 24px/1 'Barlow',sans-serif; color:#fff;\n  box-shadow:inset 0 2px 3px rgba(255,255,255,.2), inset 0 -3px 5px rgba(0,0,0,.3); }\n.gz-cp-plus { background:radial-gradient(circle at 40% 32%, #8a6bc0, #6b4a9e 72%); }\n.gz-cp-confirm { background:radial-gradient(circle at 40% 32%, #4a4a52, #16161a 72%); font-size:18px; }\n.gz-cp-lab { grid-column:1 / -1; font:500 14px/1.4 'Barlow',sans-serif; color:#55503f; text-wrap:pretty; }\n.gz-cp-lab b { color:var(--c-navy); font-weight:800; }\n\n/* keep section heads and footer credits on one line */\n.pg-stop-head { flex-wrap:nowrap; }\n.pg-stop-head span { white-space:nowrap; }\n.pl-credit span { white-space:nowrap; }\n\n/* ===================================================== BLUEPRINT THEME === */\n.blueprint .tq-press { background:rgba(120,170,240,.06); border:1px dashed rgba(150,200,255,.3); }\n.blueprint .tq-box { background:rgba(150,200,255,.06); border:1px solid rgba(150,200,255,.4);\n  box-shadow:none; }\n.blueprint .tq-box-tag { color:#8fb0e0; }\n.blueprint .tq-badge { background:transparent; border:1.5px solid #7fc3ff; color:#7fc3ff;\n  font:600 12px/22px 'JetBrains Mono',monospace; }\n.blueprint .tq-lab { color:#dce8fb; font-family:'Barlow Condensed',sans-serif; }\n.blueprint .tq-stand { color:#7fc3ff; }\n.blueprint .tq-stand-lab, .blueprint .gz-sub, .blueprint .gz-cp-lab { color:#a6c0e6; }\n.blueprint .tq-knob-face { background:radial-gradient(circle at 40% 34%, #2a4574, #16294d 78%); border-color:#7fc3ff; }\n.blueprint .tq-ptr { background:#cbdcf5; }\n.blueprint .tq-tick { background:#5f7fb0; }\n\n.blueprint .tq-legend-name { color:#a6c0e6; font-family:'Barlow Semi Condensed',sans-serif; }\n.blueprint .tq-legend-name b { color:#eaf2ff; }\n.blueprint .tq-legend-n { background:transparent; border:1.5px solid #7fc3ff; color:#7fc3ff;\n  font:600 13px/27px 'JetBrains Mono',monospace; width:30px; height:30px; }\n\n.blueprint .tq-chip-label { color:#7f9ccb; }\n.blueprint .tq-chip-sub { color:#7fc3ff; }\n.blueprint .tq-chip.tone-flat .tq-chip-sub { color:#cbdcf5; }\n.blueprint .tq-chip.tone-green .tq-chip-sub { color:#7be0a0; }\n.blueprint .tq-chip.tone-sky .tq-chip-sub { color:#9fd0ff; }\n.blueprint .tq-chip.tone-plum .tq-chip-sub { color:#c4a6ff; }\n.blueprint .tq-keycap { background:#16294d; border:1.5px solid #7fc3ff; color:#eaf2ff; }\n.blueprint .tq-black .tq-cap { background:radial-gradient(circle at 38% 32%, #3a4a64, #16294d 72%); border:1px solid #5f7fb0; box-sizing:border-box; }\n\n.blueprint .tq-knobguide { background:rgba(150,200,255,.06); border:1.5px solid #7fc3ff; }\n.blueprint .tq-kg-knob { background:radial-gradient(circle at 40% 34%, #2a4574, #16294d 78%); border-color:#7fc3ff; }\n.blueprint .tq-kg-ptr { background:#cbdcf5; }\n.blueprint .tq-kg-arc-c { background:#5f7fb0; }\n.blueprint .tq-kg-arc-l { background:#9fd0ff; }\n.blueprint .tq-kg-arc-r { background:#7fc3ff; }\n.blueprint .tq-kg-cap-c { color:#8fb0e0; }\n.blueprint .tq-kg-cap-l { color:#9fd0ff; }\n.blueprint .tq-kg-cap-r { color:#7fc3ff; }\n.blueprint .tq-kg-v { color:#a6c0e6; font-family:'Barlow Semi Condensed',sans-serif; }\n.blueprint .tq-kg-list li { border-bottom-color:rgba(150,200,255,.16); }\n.blueprint .tq-kg-list li.tone-sky .tq-kg-k { color:#9fd0ff; }\n.blueprint .tq-kg-list li.tone-navy .tq-kg-k { color:#7fc3ff; }\n.blueprint .tq-kg-list li.tone-flat .tq-kg-k { color:#8fb0e0; }\n\n.blueprint .gz-lights { background:rgba(120,255,180,.06); border:1px solid rgba(123,224,160,.45); }\n.blueprint .gz-lights-tag { color:#7be0a0; }\n.blueprint .gz-num { background:#1c7a3f; }\n.blueprint .gz-lab { color:#eaf2ff; font-family:'Barlow Condensed',sans-serif; }\n.blueprint .gz-arrow { color:#7be0a0; }\n.blueprint .gz-cp { background:rgba(150,200,255,.06); border:1.5px solid #7fc3ff; }\n.blueprint .gz-cp-tag { color:#7fc3ff; }\n.blueprint .gz-cp-lab b { color:#9fd0ff; }\n<\u002Fstyle>\n<style>\n  html, body { margin:0; height:100%; background:#20242a; }\n  deck-stage:not(:defined){ visibility:hidden; }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n  <!-- ============ SLIDE 0 · HUB ============ -->\n  <section class=\"slide hub\" data-label=\"Inicio\">\n    <div class=\"hdr\">\n      <div class=\"hdr-brand\">\n        <img src=\"e20ea9ae-017a-4eb3-9619-72cf4b7406c7\" alt=\"ADF\">\n        <span class=\"bar\"><\u002Fspan>\n        <div class=\"hdr-eyebrow\">Línea de Postes · Calibre 14<b>LP-P14<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hdr-doc\">Instructivo interactivo<br><b>Arranque de la línea<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hub-lead\">\n      <div class=\"k\">Instructivo interactivo<\u002Fdiv>\n      <h1>Arranque de la línea LP-P14<\u002Fh1>\n      <p>De la cinta de acero al poste terminado. Recorre cada apartado para ver el paso a paso, con fotos, herramientas y cuidados.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"flow\" id=\"flow\"><\u002Fdiv>\n\n    <div class=\"hub-foot\">\n      <span>LP-P14 · Arranque · REV. 01<\u002Fspan>\n      <span class=\"hint\"><span class=\"dot\"><\u002Fspan>Toca una fase para comenzar<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE SLIDES (filled by script) ============ -->\n  <section class=\"slide phase\" data-label=\"01 Montaje\" data-phase=\"0\"><\u002Fsection>\n  <section class=\"slide phase\" data-label=\"02 Cambio de Troquel\" data-phase=\"1\"><\u002Fsection>\n  <section class=\"slide phase\" data-label=\"03 Desbobinadora\" data-phase=\"2\"><\u002Fsection>\n  <section class=\"slide phase\" data-label=\"04 Configuración\" data-phase=\"3\"><\u002Fsection>\n  <section class=\"slide phase\" data-label=\"05 Prensa y Guillotina\" data-phase=\"4\"><\u002Fsection>\n  <section class=\"slide phase\" data-label=\"06 Calidad\" data-phase=\"5\"><\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script src=\"38a51d62-1189-4b50-8cf8-e126ab98b21c\"><\u002Fscript>\n<script src=\"c9f2ee31-0d89-4d60-aa93-1dc54581886b\"><\u002Fscript>\n<script src=\"9c98eec8-e90d-4baa-a1cb-13d37ff31fc6\"><\u002Fscript>\n<script src=\"9531fc7f-5c63-432b-b629-91e593d6baf7\"><\u002Fscript>\n<script>\n(function(){\n  const LP = window.LP14;\n  const deck = () => document.querySelector('deck-stage');\n\n  // --- inline icons ---\n  const IC = {\n    arrow: '<svg viewBox=\"0 0 24 14\" fill=\"none\"><path d=\"M1 7h21M16 1l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n    back:  '<svg viewBox=\"0 0 24 14\" fill=\"none\"><path d=\"M23 7H2M8 1L2 7l6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n    plus:  '<svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><\u002Fsvg>',\n    close: '<svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 5l14 14M19 5L5 19\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><\u002Fsvg>',\n    ext:   '<svg viewBox=\"0 0 24 14\" fill=\"none\"><path d=\"M1 7h20M15 1l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n    video: '<svg viewBox=\"0 0 44 44\" fill=\"none\"><rect x=\"3\" y=\"10\" width=\"26\" height=\"24\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M29 18l12-6v20l-12-6z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n  };\n  const esc = (s) => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n  const toolsHTML = (tools) => `<div class=\"tools\">${tools.map(t=>`<span class=\"chip\">${esc(t)}<\u002Fspan>`).join('')}<\u002Fdiv>`;\n  const reportFieldsHTML = (fields) => `<div class=\"rpt-fields\">${fields.map(f=>`<span class=\"rpt-field\"><span class=\"rpt-fl\">${esc(f)}<\u002Fspan><span class=\"rpt-fb\"><\u002Fspan><\u002Fspan>`).join('')}<\u002Fdiv>`;\n\n  /* -------------------- interactive control-panel renderer -------------------- */\n  const PANEL_CONTROLS = [\n    { id:'estop',   x:41, y:13, type:'estop' },\n    { id:'arrancar',x:28, y:60, type:'button', color:'green', tab:'ARRANCAR' },\n    { id:'parar',   x:45, y:60, type:'button', color:'red',   tab:'PARAR' },\n    { id:'fwdrev',  x:62, y:60, type:'selector2', pos:'fwd', tab:'FWD · REV' },\n    { id:'dial',    x:79, y:60, type:'dial', value:0, tab:'VELOCIDAD' },\n    { id:'mode',    x:41, y:82, type:'selector3', pos:'neutral', tab:'MAN · FUE · AUT' },\n  ];\n  const PANEL_INFO = [\n    { id:'marcha', x:28, y:39, type:'light', color:'green' },\n    { id:'parado', x:45, y:39, type:'light', color:'red' },\n    { id:'falla',  x:62, y:39, type:'light', color:'amber' },\n    { id:'vfd',    x:81, y:16, type:'vfd' },\n  ];\n  function ctrlHTML(it, cfg) {\n    const active = (cfg.active || []).includes(it.id);\n    const lit = it.type === 'light' && cfg.lit === it.id;\n    let inner = '';\n    if (it.type === 'estop') {\n      inner = `<div class=\"estop-ring\"><div class=\"estop-dome\"><span class=\"estop-x\"><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n    } else if (it.type === 'light') {\n      inner = `<div class=\"lens\"><span class=\"lens-glow\"><\u002Fspan><\u002Fdiv>`;\n    } else if (it.type === 'button') {\n      inner = `<div class=\"pbtn\"><span class=\"pbtn-top\"><\u002Fspan><\u002Fdiv>`;\n    } else if (it.type === 'selector2') {\n      const pos = cfg.fwd || it.pos; const ang = pos === 'rev' ? 48 : -48;\n      inner = `<div class=\"knob\"><span class=\"knob-pointer\" style=\"transform:translate(-50%,-100%) rotate(${ang}deg)\"><\u002Fspan><\u002Fdiv>`;\n    } else if (it.type === 'selector3') {\n      const pos = cfg.mode || it.pos; const ang = pos === 'manual' ? -52 : pos === 'auto' ? 52 : 0;\n      inner = `<div class=\"knob\"><span class=\"knob-pointer\" style=\"transform:translate(-50%,-100%) rotate(${ang}deg)\"><\u002Fspan><\u002Fdiv>`;\n    } else if (it.type === 'dial') {\n      const val = cfg.dial != null ? cfg.dial : it.value;\n      const ang = -135 + (val / 10) * 270;\n      let ticks = '';\n      for (let i = 0; i < 11; i++) ticks += `<span class=\"dial-tick\" style=\"transform:rotate(${-135 + i * 27}deg) translateY(calc(var(--s) * -0.052))\"><\u002Fspan>`;\n      inner = `<div class=\"dial-bezel\"><div class=\"dial-face\">${ticks}<span class=\"dial-knob\"><\u002Fspan><span class=\"dial-pointer\" style=\"transform:translate(-50%,-100%) rotate(${ang}deg)\"><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n    } else if (it.type === 'vfd') {\n      const hz = (cfg.lit === 'marcha' && cfg.dial != null) ? (cfg.dial * 6).toFixed(1) : '0.0';\n      inner = `<div class=\"vfd\"><div class=\"vfd-screen\"><span class=\"vfd-hz\">${hz} <em>Hz<\u002Fem><\u002Fspan><\u002Fdiv><div class=\"vfd-keys\"><span class=\"vfd-dpad\"><\u002Fspan><span class=\"vfd-soft\">STOP<\u002Fspan><span class=\"vfd-soft\">START<\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n    }\n    const cls = `ctrl ctrl-${it.type} c-${it.color || ''}${lit ? ' lit' : ''}${active ? ' is-active' : ''}`;\n    return `<div class=\"${cls}\" style=\"left:${it.x}%;top:${it.y}%\">${it.tab ? `<span class=\"ctrl-tab\">${it.tab}<\u002Fspan>` : ''}${inner}<\u002Fdiv>`;\n  }\n  function buildPanel(cfg) {\n    cfg = cfg || {};\n    const all = [...PANEL_CONTROLS, ...PANEL_INFO];\n    const hasActive = (cfg.active || []).length > 0;\n    return `<div class=\"panel theme-paper${hasActive ? ' has-active' : ''}\" style=\"--s:520px\"><div class=\"panel-face\">` +\n      `<span class=\"lock lock-tl\"><\u002Fspan><span class=\"lock lock-bl\"><\u002Fspan><span class=\"hinge hinge-t\"><\u002Fspan><span class=\"hinge hinge-b\"><\u002Fspan>` +\n      all.map(it => ctrlHTML(it, cfg)).join('') + `<\u002Fdiv><\u002Fdiv>`;\n  }\n\n  // per-step panel state for the desbobinadora tablero (keyed by global step n)\n  const DESBOB_PANEL = {\n    1: { active:['dial','mode'], lit:'parado', mode:'neutral', dial:0 },\n    2: { active:['estop'], lit:'parado', mode:'neutral', dial:0 },\n    3: { active:['fwdrev','mode'], lit:'marcha', mode:'manual', fwd:'fwd', dial:2 },\n    4: { active:[], lit:'parado', mode:'neutral', dial:0,\n         note:'La aceitera y el liberador de aire son controles físicos de la máquina, no de este tablero eléctrico.' },\n    5: { active:['fwdrev','mode'], lit:'marcha', mode:'auto', fwd:'fwd', dial:5 },\n    6: { active:['dial','vfd'], lit:'marcha', mode:'auto', fwd:'fwd', dial:6 },\n  };\n\n  function buildDesbob(sec, p, header) {\n    const steps = p.steps;\n    const bodyHTML = `\n      <div class=\"db-body\">\n        <div class=\"db-panelcol\">\n          <div class=\"db-panel\" id=\"db-panel-${p.id}\"><\u002Fdiv>\n          <span class=\"db-cap\">El tablero — se enciende según el paso<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"db-side\">\n          <span class=\"db-hint\">Toca un paso para verlo en el tablero<\u002Fspan>\n          <div class=\"db-steps\">\n            ${steps.map((s, i) => `\n            <button class=\"db-step${i === 0 ? ' on' : ''}\" data-idx=\"${i}\">\n              <span class=\"db-n\">${s.n}<\u002Fspan>\n              <span class=\"db-t\">${esc(s.title)}<\u002Fspan>\n              <span class=\"db-more\" data-more=\"${i}\" title=\"Foto y video\">${IC.plus}<\u002Fspan>\n            <\u002Fbutton>`).join('')}\n          <\u002Fdiv>\n          <div class=\"db-readout\" id=\"db-readout-${p.id}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n\n    const panels = steps.map((s, idx) => `\n      <div class=\"detail\" data-idx=\"${idx}\" style=\"display:none\">\n        <button class=\"detail-close\" aria-label=\"Cerrar\">${IC.close}<\u002Fbutton>\n        <div class=\"detail-media\">\n          <span class=\"media-note\">Foto del paso<\u002Fspan>\n          <image-slot id=\"slot-photo-${p.id}-${s.n}\" style=\"width:100%;height:340px\" shape=\"rect\"\n            placeholder=\"Arrastra aquí una foto de este paso\"><\u002Fimage-slot>\n          <span class=\"media-note\">Video corto<\u002Fspan>\n          <div class=\"vslot\" data-vs=\"${p.id}-${s.n}\">\n            <div class=\"vph\">${IC.video}<span>Arrastra un video<br/>(lo grabas después)<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"detail-body\">\n          <span class=\"d-step\">Paso ${s.n} · ${esc(p.name)}<\u002Fspan>\n          <h3 class=\"d-title\">${esc(s.title)}<\u002Fh3>\n          <p class=\"d-desc\">${esc(s.desc)}<\u002Fp>\n          <div class=\"d-sect\">\n            <div class=\"d-label\">${s.report ? 'Casillas a documentar · ' + esc(s.report.when) : 'Herramienta / equipo'}<\u002Fdiv>\n            ${s.report ? reportFieldsHTML(s.report.fields) : toolsHTML(s.tools)}\n          <\u002Fdiv>\n          <div class=\"d-tip${s.crit ? ' crit' : ''}\">\n            <span class=\"m\">!<\u002Fspan>\n            <p><b>${s.crit ? 'Cuidado crítico' : 'Tip · cuidado'}<\u002Fb>${esc(s.tip)}<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"d-nav\">\n            <button class=\"d-prev\">${IC.back} Anterior<\u002Fbutton>\n            <span class=\"d-count\">${idx + 1} / ${steps.length}<\u002Fspan>\n            <button class=\"d-next\">Siguiente ${IC.arrow}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('');\n\n    sec.innerHTML = header + bodyHTML + `<div class=\"detail-scrim\">${panels}<\u002Fdiv>`;\n\n    // ---- panel + readout, driven by the selected step ----\n    const panelEl = sec.querySelector(`#db-panel-${p.id}`);\n    const readout = sec.querySelector(`#db-readout-${p.id}`);\n    const stepBtns = [...sec.querySelectorAll('.db-step')];\n    function select(i) {\n      stepBtns.forEach((b, k) => b.classList.toggle('on', k === i));\n      const s = steps[i];\n      const cfg = DESBOB_PANEL[s.n] || {};\n      panelEl.innerHTML = buildPanel(cfg);\n      readout.innerHTML = `<h4>${esc(s.title)}<\u002Fh4><p>${esc(s.desc)}<\u002Fp>` +\n        (cfg.note ? `<p class=\"db-note\">${esc(cfg.note)}<\u002Fp>` : '') +\n        `<div class=\"tools\">${s.tools.map(t => `<span class=\"chip\">${esc(t)}<\u002Fspan>`).join('')}<\u002Fdiv>`;\n    }\n    stepBtns.forEach((b, i) => b.addEventListener('click', (e) => {\n      if (e.target.closest('.db-more')) return;\n      select(i);\n    }));\n    select(0);\n\n    // ---- photo/video overlay (same behaviour as other phases) ----\n    const scrim = sec.querySelector('.detail-scrim');\n    const details = [...scrim.querySelectorAll('.detail')];\n    let cur = 0;\n    const show = (i) => {\n      cur = Math.max(0, Math.min(details.length - 1, i));\n      details.forEach((d, k) => d.style.display = (k === cur ? 'grid' : 'none'));\n      const d = details[cur];\n      d.querySelector('.d-prev').disabled = cur === 0;\n      d.querySelector('.d-next').disabled = cur === details.length - 1;\n    };\n    const open = (i) => { show(i); scrim.classList.add('open'); };\n    const close = () => scrim.classList.remove('open');\n    sec.querySelectorAll('.db-more').forEach(m => m.addEventListener('click', (e) => {\n      e.stopPropagation(); open(+m.dataset.more);\n    }));\n    scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });\n    scrim.querySelectorAll('.detail-close').forEach(b => b.addEventListener('click', close));\n    scrim.querySelectorAll('.d-prev').forEach(b => b.addEventListener('click', () => show(cur - 1)));\n    scrim.querySelectorAll('.d-next').forEach(b => b.addEventListener('click', () => show(cur + 1)));\n    sec._overlay = { isOpen: () => scrim.clas ), close, prev: () => show(cur - 1), next: () => show(cur + 1) };\n  }\n\n  /* -------------------- PRENSA (tablero de troquelado) -------------------- */\n  const PRENSA_LEFT = [\n    { id:'onoff',    n:1, glyph:'knob',  pos:'on',      label:'PERILLA ON / OFF' },\n    { id:'arrancar', n:2, glyph:'green',                label:'ARRANCAR' },\n    { id:'paro',     n:3, glyph:'estop',                label:'PARO DE EMERGENCIA' },\n    { id:'ramdown',  n:4, glyph:'black',                label:'RAM DOWN' },\n  ];\n  const PRENSA_RIGHT = [\n    { id:'troquel', n:6, glyph:'knob',  pos:'neutral',  label:'PERILLA DEL TROQUEL' },\n    { id:'ramup',   n:5, glyph:'black',                 label:'RAM UP' },\n    { id:'ramdown', n:4, glyph:'black',                 label:'RAM DOWN' },\n  ];\n  const PRENSA_PANEL = {\n    1: { active:['onoff','troquel'], onoff:'off', troquel:'neutral' },\n    2: { active:['paro'] },\n    3: { active:['onoff','arrancar'], onoff:'on' },\n    4: { active:['ramdown'] },\n    5: { active:['troquel'], troquel:'der' },\n    6: { active:['ramdown','troquel'], troquel:'neutral' },\n    7: { active:[], arr:['oi','lever','start'], cp:['on'] },\n    8: { active:[], cp:['alim'] },\n    9: { active:['troquel'], troquel:'izq' },\n  };\n  function tqGlyph(glyph, pos) {\n    if (glyph === 'knob') {\n      const ANG = { neutral:0, on:0, off:-30, izq:-52, der:52 };\n      const a = ANG[pos] != null ? ANG[pos] : 0;\n      return `<span class=\"tq-g tq-g-knob\"><span class=\"tq-knob-face\">` +\n        `<span class=\"tq-tick tq-tick-l\"><\u002Fspan><span class=\"tq-tick tq-tick-c\"><\u002Fspan><span class=\"tq-tick tq-tick-r\"><\u002Fspan>` +\n        `<span class=\"tq-ptr\" style=\"transform:translate(-50%,-100%) rotate(${a}deg)\"><\u002Fspan><\u002Fspan><\u002Fspan>`;\n    }\n    if (glyph === 'estop') return `<span class=\"tq-g tq-g-estop\"><span class=\"tq-dome\"><span class=\"tq-dome-x\"><\u002Fspan><\u002Fspan><\u002Fspan>`;\n    if (glyph === 'oi') return `<span class=\"tq-g tq-g-oi\"><span class=\"tq-oi-o\">O<\u002Fspan><span class=\"tq-oi-i\">I<\u002Fspan><\u002Fspan>`;\n    if (glyph === 'lever') return `<span class=\"tq-g tq-g-lever\"><span class=\"tq-lever-track\"><span class=\"tq-lever-stick\"><\u002Fspan><\u002Fspan><\u002Fspan>`;\n    const tone = glyph === 'green' ? 'tq-green' : glyph === 'red' ? 'tq-red' : 'tq-black';\n    return `<span class=\"tq-g tq-g-btn ${tone}\"><span class=\"tq-cap\"><\u002Fspan><\u002Fspan>`;\n  }\n  const PRESS_SVG = `<div class=\"tq-stand\">\n    <svg viewBox=\"0 0 150 224\" aria-hidden=\"true\">\n      <g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n        <rect x=\"16\" y=\"10\" width=\"118\" height=\"20\" rx=\"3\"/>\n        <line x1=\"28\" y1=\"30\" x2=\"28\" y2=\"194\"/>\n        <line x1=\"52\" y1=\"30\" x2=\"52\" y2=\"194\"/>\n        <line x1=\"98\" y1=\"30\" x2=\"98\" y2=\"194\"/>\n        <line x1=\"122\" y1=\"30\" x2=\"122\" y2=\"194\"/>\n        <rect x=\"63\" y=\"3\" width=\"24\" height=\"20\" rx=\"2\"/>\n        <rect x=\"70\" y=\"30\" width=\"10\" height=\"56\" rx=\"2\"/>\n        <rect x=\"56\" y=\"86\" width=\"38\" height=\"20\" rx=\"2\"/>\n        <rect x=\"50\" y=\"152\" width=\"50\" height=\"16\" rx=\"2\"/>\n        <rect x=\"16\" y=\"194\" width=\"118\" height=\"20\" rx=\"3\"/>\n      <\u002Fg>\n      <g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        <line x1=\"75\" y1=\"114\" x2=\"75\" y2=\"140\"/>\n        <polyline points=\"68,133 75,143 82,133\"/>\n      <\u002Fg>\n      <circle cx=\"28\" cy=\"66\" r=\"11\" fill=\"#f5f2ea\" stroke=\"currentColor\" stroke-width=\"3\"/>\n      <line x1=\"28\" y1=\"66\" x2=\"33\" y2=\"59\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n    <\u002Fsvg>\n    <span class=\"tq-stand-lab\">ARIETE · TROQUEL · PRENSA BECKWOOD<\u002Fspan>\n  <\u002Fdiv>`;\n  function tqBox(tag, rows, cfg) {\n    const active = new Set(cfg.active || []);\n    return `<div class=\"tq-box\"><span class=\"tq-box-tag\">${tag}<\u002Fspan>` +\n      rows.map(r => {\n        let pos = r.pos;\n        if (r.id === 'onoff' && cfg.onoff) pos = cfg.onoff;\n        if (r.id === 'troquel' && cfg.troquel) pos = cfg.troquel;\n        const on = active.has(r.id);\n        return `<div class=\"tq-ctrl${on ? ' is-active' : ''}\"><span class=\"tq-badge\">${r.n}<\u002Fspan>${tqGlyph(r.glyph, pos)}<span class=\"tq-lab\">${r.label}<\u002Fspan><\u002Fdiv>`;\n      }).join('') + `<\u002Fdiv>`;\n  }\n  const GZ_ARROW = `<svg viewBox=\"0 0 36 18\" fill=\"none\"><path d=\"M2 9h29M26 3l7 6-7 6\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>`;\n  const GZ_ITEMS = [\n    { id:'oi',    glyph:'oi',    n:1, lab:'BOTÓN VERDE I', sub:'caja O / I · arranca el motor' },\n    { id:'lever', glyph:'lever', n:2, lab:'PALANCA',       sub:'motor de transporte · enciéndela' },\n    { id:'start', glyph:'green', n:3, lab:'START VERDE',   sub:'caja START / STOP · botón circular' },\n  ];\n  function buildArranques(cfg) {\n    const arr = new Set(cfg.arr || []);\n    const hasArr = (cfg.arr || []).length > 0;\n    const boxes = GZ_ITEMS.map((it, i) => {\n      const on = arr.has(it.id);\n      return `<div class=\"gz-box${on ? ' is-active' : ''}\"><span class=\"gz-num\">${it.n}<\u002Fspan><span class=\"gz-glyph\">${tqGlyph(it.glyph)}<\u002Fspan><span class=\"gz-lab\">${it.lab}<\u002Fspan><span class=\"gz-sub\">${it.sub}<\u002Fspan><\u002Fdiv>` +\n        (i < GZ_ITEMS.length - 1 ? `<span class=\"gz-arrow\">${GZ_ARROW}<\u002Fspan>` : '');\n    }).join('');\n    return `<div class=\"gz-lights pr-gz${hasArr ? ' has-active' : ''}\"><span class=\"gz-lights-tag\">GUILLOTINA · ENCIENDE LOS 3 ARRANQUES EN ORDEN<\u002Fspan><div class=\"gz-lights-row\">${boxes}<\u002Fdiv><\u002Fdiv>`;\n  }\n  function buildCP4(cfg) {\n    const cp = new Set(cfg.cp || []);\n    const onHot = cp.has('on') ? ' is-hot' : '';\n    const alimHot = cp.has('alim') ? ' is-hot' : '';\n    return `<div class=\"cp4-box\">\n      <span class=\"cp4-tag\">CAJA DE ALIMENTADAS · CP 4<\u002Fspan>\n      <div class=\"cp4-unit\">\n        <div class=\"cp4-screen\"><span class=\"cp4-cp\">CP 4<\u002Fspan><span class=\"cp4-read\">ALIM <b>04<\u002Fb><\u002Fspan><\u002Fdiv>\n        <div class=\"cp4-btns\">\n          <span class=\"cp4-btn cp4-on${onHot}\"><\u002Fspan>\n          <span class=\"cp4-btn\"><\u002Fspan>\n          <span class=\"cp4-btn\"><\u002Fspan>\n          <span class=\"cp4-btn\"><\u002Fspan>\n          <span class=\"cp4-rst${alimHot}\">RST<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cp4-legend\">\n        <span class=\"cp4-leg cp4-leg-on\"><i><\u002Fi>ON · enciende la caja<\u002Fspan>\n        <span class=\"cp4-leg cp4-leg-alim\"><i><\u002Fi># DE ALIMENTADAS · cuántas láminas antes de cortar<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n  function buildPress(cfg) {\n    cfg = cfg || {};\n    const hasActive = (cfg.active || []).length > 0;\n    return `<div class=\"tq-press${hasActive ? ' has-active' : ''}\">${tqBox('CAJA IZQUIERDA', PRENSA_LEFT, cfg)}${PRESS_SVG}${tqBox('CAJA DERECHA', PRENSA_RIGHT, cfg)}<\u002Fdiv>` +\n      `<div class=\"pr-guilla\">${buildArranques(cfg)}${buildCP4(cfg)}<\u002Fdiv>`;\n  }\n\n  function buildPrensa(sec, p, header) {\n    const steps = p.steps;\n    const word = p.stepWord || 'Paso';\n    const bodyHTML = `\n      <div class=\"db-body cf-body pr-body\">\n        <div class=\"db-panelcol cf-panelcol\">\n          <div class=\"db-panel\" id=\"db-panel-${p.id}\"><\u002Fdiv>\n          <span class=\"db-cap\">Toca un movimiento: se encienden los controles de la prensa y, en el arranque, los 3 arranques de la guillotina.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"db-side\">\n          <span class=\"db-hint\">Toca un movimiento para verlo en el tablero<\u002Fspan>\n          <div class=\"db-steps\">\n            ${steps.map((s, i) => `\n            <button class=\"db-step${i === 0 ? ' on' : ''}\" data-idx=\"${i}\">\n              <span class=\"db-n\">${s.n}<\u002Fspan>\n              <span class=\"db-t\">${esc(s.title)}<\u002Fspan>\n              <span class=\"db-more\" data-more=\"${i}\" title=\"Foto y video\">${IC.plus}<\u002Fspan>\n            <\u002Fbutton>`).join('')}\n          <\u002Fdiv>\n          <div class=\"db-readout\" id=\"db-readout-${p.id}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n\n    const panels = steps.map((s, idx) => `\n      <div class=\"detail\" data-idx=\"${idx}\" style=\"display:none\">\n        <button class=\"detail-close\" aria-label=\"Cerrar\">${IC.close}<\u002Fbutton>\n        <div class=\"detail-media\">\n          <span class=\"media-note\">Foto del movimiento<\u002Fspan>\n          <image-slot id=\"slot-photo-${p.id}-${s.n}\" style=\"width:100%;height:340px\" shape=\"rect\"\n            placeholder=\"Arrastra aquí una foto de este movimiento\"><\u002Fimage-slot>\n          <span class=\"media-note\">Video corto<\u002Fspan>\n          <div class=\"vslot\" data-vs=\"${p.id}-${s.n}\">\n            <div class=\"vph\">${IC.video}<span>Arrastra un video<br/>(lo grabas después)<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"detail-body\">\n          <span class=\"d-step\">${word} ${s.n} · ${esc(p.name)}<\u002Fspan>\n          <h3 class=\"d-title\">${esc(s.title)}<\u002Fh3>\n          <p class=\"d-desc\">${esc(s.desc)}<\u002Fp>\n          <div class=\"d-sect\">\n            <div class=\"d-label\">${s.report ? 'Casillas a documentar · ' + esc(s.report.when) : 'Herramienta / equipo'}<\u002Fdiv>\n            ${s.report ? reportFieldsHTML(s.report.fields) : toolsHTML(s.tools)}\n          <\u002Fdiv>\n          <div class=\"d-tip${s.crit ? ' crit' : ''}\">\n            <span class=\"m\">!<\u002Fspan>\n            <p><b>${s.crit ? 'Cuidado crítico' : 'Tip · cuidado'}<\u002Fb>${esc(s.tip)}<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"d-nav\">\n            <button class=\"d-prev\">${IC.back} Anterior<\u002Fbutton>\n            <span class=\"d-count\">${idx + 1} / ${steps.length}<\u002Fspan>\n            <button class=\"d-next\">Siguiente ${IC.arrow}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('');\n\n    sec.innerHTML = header + bodyHTML + `<div class=\"detail-scrim\">${panels}<\u002Fdiv>`;\n\n    const panelEl = sec.querySelector(`#db-panel-${p.id}`);\n    const readout = sec.querySelector(`#db-readout-${p.id}`);\n    const stepBtns = [...sec.querySelectorAll('.db-step')];\n    function select(i) {\n      stepBtns.forEach((b, k) => b.classList.toggle('on', k === i));\n      const s = steps[i];\n      const cfg = PRENSA_PANEL[s.n] || {};\n      panelEl.innerHTML = buildPress(cfg);\n      readout.innerHTML = `<h4>${esc(s.title)}<\u002Fh4><p>${esc(s.desc)}<\u002Fp>` +\n        (cfg.note ? `<p class=\"db-note\">${esc(cfg.note)}<\u002Fp>` : '') +\n        `<div class=\"tools\">${s.tools.map(t => `<span class=\"chip\">${esc(t)}<\u002Fspan>`).join('')}<\u002Fdiv>`;\n    }\n    stepBtns.forEach((b, i) => b.addEventListener('click', (e) => {\n      if (e.target.closest('.db-more')) return;\n      select(i);\n    }));\n    select(0);\n\n    const scrim = sec.querySelector('.detail-scrim');\n    const details = [...scrim.querySelectorAll('.detail')];\n    let cur = 0;\n    const show = (i) => {\n      cur = Math.max(0, Math.min(details.length - 1, i));\n      details.forEach((d, k) => d.style.display = (k === cur ? 'grid' : 'none'));\n      const d = details[cur];\n      d.querySelector('.d-prev').disabled = cur === 0;\n      d.querySelector('.d-next').disabled = cur === details.length - 1;\n    };\n    const open = (i) => { show(i); scrim.classList.add('open'); };\n    const close = () => scrim.classList.remove('open');\n    sec.querySelectorAll('.db-more').forEach(m => m.addEventListener('click', (e) => {\n      e.stopPropagation(); open(+m.dataset.more);\n    }));\n    scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });\n    scrim.querySelectorAll('.detail-close').forEach(b => b.addEventListener('click', close));\n    scrim.querySelectorAll('.d-prev').forEach(b => b.addEventListener('click', () => show(cur - 1)));\n    scrim.querySelectorAll('.d-next').forEach(b => b.addEventListener('click', () => show(cur + 1)));\n    sec._overlay = { isOpen: () => scrim.classList.contains('open'), close, prev: () => show(cur - 1), next: () => show(cur + 1) };\n  }\n\n  /* -------------------- HUB timeline -------------------- */\n  const SVG_OPEN = '<svg viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">';\n  const PHASE_ICONS = {\n    montaje: SVG_OPEN + '<circle cx=\"32\" cy=\"24\" r=\"16\"/><circle cx=\"32\" cy=\"24\" r=\"7\"/><path d=\"M21 36 L15 52\"/><path d=\"M43 36 L49 52\"/><path d=\"M11 52 H53\"/><\u002Fsvg>',\n    troquel: SVG_OPEN + '<path d=\"M16 24 V13\"/><path d=\"M32 24 V10\"/><path d=\"M48 24 V13\"/><circle cx=\"16\" cy=\"11\" r=\"2.3\"/><circle cx=\"48\" cy=\"11\" r=\"2.3\"/><rect x=\"9\" y=\"24\" width=\"46\" height=\"12\" rx=\"1.5\"/><rect x=\"13\" y=\"40\" width=\"38\" height=\"8\" rx=\"1.5\"/><circle cx=\"19\" cy=\"30\" r=\"1.5\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"27\" cy=\"30\" r=\"1.5\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"35\" cy=\"30\" r=\"1.5\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"43\" cy=\"30\" r=\"1.5\" fill=\"currentColor\" stroke=\"none\"/><\u002Fsvg>',\n    desbob: SVG_OPEN + '<rect x=\"9\" y=\"12\" width=\"46\" height=\"40\" rx=\"4\"/><circle cx=\"21\" cy=\"25\" r=\"5.5\"/><circle cx=\"21\" cy=\"25\" r=\"1.4\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"40\" cy=\"24\" r=\"4\"/><circle cx=\"21\" cy=\"41\" r=\"3.2\"/><circle cx=\"40\" cy=\"40\" r=\"5.5\"/><path d=\"M40 40 L43.5 36.5\"/><\u002Fsvg>',\n    configuracion: SVG_OPEN + '<rect x=\"10\" y=\"9\" width=\"44\" height=\"46\" rx=\"4\"/><rect x=\"16\" y=\"15\" width=\"32\" height=\"9\" rx=\"1.5\"/><circle cx=\"20\" cy=\"34\" r=\"2.7\"/><circle cx=\"32\" cy=\"34\" r=\"2.7\"/><circle cx=\"44\" cy=\"34\" r=\"2.7\"/><circle cx=\"20\" cy=\"45\" r=\"2.7\"/><circle cx=\"32\" cy=\"45\" r=\"2.7\"/><circle cx=\"44\" cy=\"45\" r=\"2.7\"/><\u002Fsvg>',\n    prensa: SVG_OPEN + '<path d=\"M13 9 H51\"/><path d=\"M17 9 V54\"/><path d=\"M47 9 V54\"/><path d=\"M11 54 H53\"/><rect x=\"25\" y=\"15\" width=\"14\" height=\"11\" rx=\"1.5\"/><path d=\"M32 28 V37\"/><path d=\"M28 33 L32 38 L36 33\"/><path d=\"M23 46 H41\"/><\u002Fsvg>',\n    calidad: SVG_OPEN + '<circle cx=\"27\" cy=\"26\" r=\"15\"/><path d=\"M38 37 L52 51\"/><path d=\"M20.5 26 L25 30.5 L34 20\"/><\u002Fsvg>',\n  };\n  const flow = document.getElementById('flow');\n  flow.innerHTML = `<span class=\"tl-line\"><\u002Fspan>` + LP.phases.map((p, i) => `\n    <button class=\"tl-node\" style=\"--pc:${p.accent}\" data-goto=\"${i+1}\" aria-label=\"Abrir fase ${esc(p.name)}\">\n      <span class=\"tl-badge\">${PHASE_ICONS[p.id] || ''}<\u002Fspan>\n      <span class=\"tl-code\">Fase ${p.code}<\u002Fspan>\n      <span class=\"tl-name\">${esc(p.name)}<\u002Fspan>\n      <span class=\"tl-range\">${p.steps.length} pasos<\u002Fspan>\n    <\u002Fbutton>`).join('');\n\n  /* -------------------- PHASE slides -------------------- */\n  document.querySelectorAll('section.phase').forEach(sec => {\n    const pi = +sec.dataset.phase;\n    const p = LP.phases[pi];\n    const word = p.stepWord || 'Paso';\n    sec.style.setProperty('--pa', p.accent);\n\n    const header = `\n      <div class=\"hdr\">\n        <div class=\"hdr-brand\">\n          <img src=\"assets/adf-logo.png\" alt=\"ADF\" />\n          <span class=\"bar\"><\u002Fspan>\n          <div class=\"hdr-eyebrow\">Línea de Postes · Calibre 14<b>LP-P14 · Arranque<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hdr-right\">\n          <div class=\"hdr-doc\">Fase ${p.code} de ${String(LP.phases.length).padStart(2,'0')}<br /><b>${esc(p.name)}<\u002Fb><\u002Fdiv>\n          <span class=\"hdr-vbar\"><\u002Fspan>\n          <div class=\"epp\" role=\"note\" aria-label=\"EPP obligatorio: guantes anticorte y mangas anticorte en todo momento\">\n            <span class=\"epp-badge\">EPP<\u002Fspan>\n            <span class=\"epp-txt\">\n              <span class=\"epp-k\">Obligatorio · en todo momento<\u002Fspan>\n              <span class=\"epp-d\">Guantes anticorte + mangas anticorte<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ph-title\">\n        <span class=\"ph-num\">${p.code}<\u002Fspan>\n        <div class=\"ph-heading\">\n          <div class=\"of\">${esc(p.range)}<\u002Fdiv>\n          <h2>${esc(p.name)}<\u002Fh2>\n          <p>${esc(p.blurb)}<\u002Fp>\n        <\u002Fdiv>\n        <button class=\"ph-back\" data-goto=\"0\">${IC.back} Inicio<\u002Fbutton>\n      <\u002Fdiv>`;\n\n    if (p.id === 'desbob') { buildDesbob(sec, p, header); return; }\n    if (p.id === 'configuracion') { buildConfig(sec, p, header); return; }\n    if (p.id === 'prensa') { buildPrensa(sec, p, header); return; }\n\n    let bodyHTML;\n    if (p.link) {\n      // Phase 3 — single feature that links to the full ficha\n      const s = p.steps[0];\n      bodyHTML = `\n        <div class=\"feature\">\n          <div class=\"media\">\n            <image-slot id=\"slot-photo-${s.n}\" style=\"width:100%;height:100%;min-height:520px\" shape=\"rect\"\n              placeholder=\"Arrastra aquí una foto del tablero de troquelado / guillotina\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div class=\"fbody\">\n            <h3>${esc(s.title)}<\u002Fh3>\n            <p>${esc(s.desc)}<\u002Fp>\n            <div class=\"tools\">${p.steps[0].tools.map(t=>`<span class=\"chip\">${esc(t)}<\u002Fspan>`).join('')}<\u002Fdiv>\n            <a class=\"link-btn\" href=\"${esc(p.link.href)}\" target=\"_blank\" rel=\"noopener\">${esc(p.link.label)} ${IC.ext}<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>`;\n    } else {\n      const rows = p.steps.length > 4 ? ' rows-2' : '';\n      bodyHTML = `<div class=\"steps${rows}\">${p.steps.map((s, idx) => `\n        <button class=\"step\" data-idx=\"${idx}\">\n          <span class=\"step-n\">${word} ${s.n}<\u002Fspan>\n          <span class=\"step-t\">${esc(s.title)}<\u002Fspan>\n          <span class=\"step-foot\">\n            <span class=\"step-tool\">${esc(s.tools[0])}${s.tools.length>1?` <span>+${s.tools.length-1}<\u002Fspan>`:''}<\u002Fspan>\n            <span class=\"step-more\">${IC.plus}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>`).join('')}<\u002Fdiv>`;\n    }\n\n    // detail overlay (one panel per step)\n    const panels = p.steps.map((s, idx) => `\n      <div class=\"detail\" data-idx=\"${idx}\" style=\"display:none\">\n        <button class=\"detail-close\" aria-label=\"Cerrar\">${IC.close}<\u002Fbutton>\n        <div class=\"detail-media\">\n          <span class=\"media-note\">Foto del paso<\u002Fspan>\n          <image-slot id=\"slot-photo-${p.id}-${s.n}\" style=\"width:100%;height:340px\" shape=\"rect\"\n            placeholder=\"Arrastra aquí una foto de este paso\"><\u002Fimage-slot>\n          <span class=\"media-note\">Video corto<\u002Fspan>\n          <div class=\"vslot\" data-vs=\"${p.id}-${s.n}\">\n            <div class=\"vph\">${IC.video}<span>Arrastra un video<br/>(lo grabas después)<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"detail-body\">\n          <span class=\"d-step\">${word} ${s.n} · ${esc(p.name)}<\u002Fspan>\n          <h3 class=\"d-title\">${esc(s.title)}<\u002Fh3>\n          <p class=\"d-desc\">${esc(s.desc)}<\u002Fp>\n          <div class=\"d-sect\">\n            <div class=\"d-label\">${s.report ? 'Casillas a documentar · ' + esc(s.report.when) : 'Herramienta / equipo'}<\u002Fdiv>\n            ${s.report ? reportFieldsHTML(s.report.fields) : toolsHTML(s.tools)}\n          <\u002Fdiv>\n          <div class=\"d-tip${s.crit ? ' crit' : ''}\">\n            <span class=\"m\">!<\u002Fspan>\n            <p><b>${s.crit ? 'Cuidado crítico' : 'Tip · cuidado'}<\u002Fb>${esc(s.tip)}<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"d-nav\">\n            <button class=\"d-prev\">${IC.back} Anterior<\u002Fbutton>\n            <span class=\"d-count\">${idx+1} / ${p.steps.length}<\u002Fspan>\n            <button class=\"d-next\">Siguiente ${IC.arrow}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('');\n\n    sec.innerHTML = header + bodyHTML +\n      (p.link ? '' : `<div class=\"detail-scrim\">${panels}<\u002Fdiv>`);\n\n    if (p.link) return; // no overlay wiring for feature slide\n\n    // ---- overlay interactions ----\n    const scrim = sec.querySelector('.detail-scrim');\n    const details = [...scrim.querySelectorAll('.detail')];\n    let cur = 0;\n    const show = (i) => {\n      cur = Math.max(0, Math.min(details.length - 1, i));\n      details.forEach((d, k) => d.style.display = (k === cur ? 'grid' : 'none'));\n      const d = details[cur];\n      d.querySelector('.d-prev').disabled = cur === 0;\n      d.querySelector('.d-next').disabled = cur === details.length - 1;\n    };\n    const open = (i) => { show(i); scrim.classList.add('open'); };\n    const close = () => scrim.classList.remove('open');\n\n    sec.querySelectorAll('.step').forEach(btn =>\n      btn.addEventListener('click', () => open(+btn.dataset.idx)));\n    scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });\n    scrim.querySelectorAll('.detail-close').forEach(b => b.addEventListener('click', close));\n    scrim.querySelectorAll('.d-prev').forEach(b => b.addEventListener('click', () => show(cur - 1)));\n    scrim.querySelectorAll('.d-next').forEach(b => b.addEventListener('click', () => show(cur + 1)));\n\n    // keep arrow keys / esc for the overlay, not the deck, while open\n    sec._overlay = { isOpen: () => scrim.classList.contains('open'), close, prev: () => show(cur-1), next: () => show(cur+1) };\n  });\n\n  /* -------------------- video drop (persistencia vía LP14Media) --------------------\n     La persistencia (IndexedDB) y la exportación viven en lp14-media.js.\n     Aquí solo pintamos las tarjetas y conectamos drag & drop. */\n  const VM = window.LP14Media;\n\n  function renderVideo(vs, blob) {\n    const url = URL.createObjectURL(blob);\n    vs.innerHTML = `<video src=\"${url}\" controls muted loop playsinline><\u002Fvideo>` +\n      `<button class=\"vslot-clear\" title=\"Quitar video\">${IC.close}<\u002Fbutton>`;\n    vs.classList.add('has-video');\n  }\n\n  function restoreVideos() {\n    document.querySelectorAll('.vslot').forEach(vs => {\n      const key = vs.dataset.vs;\n      VM.videoGet(key).then(blob => { if (blob) renderVideo(vs, blob); })\n        .catch(e => console.warn('No se pudo restaurar el video', key, e));\n    });\n  }\n  restoreVideos();\n  window._restoreVideos = restoreVideos;\n\n  /* -------------------- boton X para quitar FOTOS --------------------\n     image-slot ya persiste la foto (via LP14Media -> IndexedDB). Aqui solo\n     agregamos una X siempre visible en la esquina superior derecha para\n     quitarla, igual que en los videos. */\n  function addPhotoX(slot) {\n    if (slot.__wrapped || !slot.parentNode) return;\n    slot.__wrapped = true;\n    const wrap = document.createElement('div');\n    wrap.className = 'mslot-wrap';\n    slot.parentNode.insertBefore(wrap, slot);\n    wrap.appendChild(slot);\n    const x = document.createElement('button');\n    x.type = 'button';\n    x.className = 'mslot-x';\n    x.title = 'Quitar foto';\n    x.innerHTML = IC.close;\n    wrap.appendChild(x);\n    x.addEventListener('click', (e) => {\n      e.preventDefault(); e.stopPropagation();\n      const clr = slot.shadowRoot && slot.shadowRoot.querySelector('[data-act=\"clear\"]');\n      if (clr) clr.click();\n    });\n    const sync = () => wrap.classList.toggle('has', slot.hasAttribute('data-filled'));\n    new MutationObserver(sync).observe(slot, { attributes: true, attributeFilter: ['data-filled'] });\n    sync();\n  }\n  document.querySelectorAll('image-slot').forEach(addPhotoX);\n\n  function saveVideo(key, file) {\n    const vs = document.querySelector(`.vslot[data-vs=\"${key}\"]`);\n    if (vs) renderVideo(vs, file);\n    VM.videoPut(key, file).catch(e => console.warn('No se pudo guardar el video', key, e));\n  }\n\n  function removeVideo(key) {\n    VM.videoDel(key).catch(() => {});\n    const vs = document.querySelector(`.vslot[data-vs=\"${key}\"]`);\n    if (vs) {\n      vs.classList.remove('has-video');\n      vs.innerHTML = `<div class=\"vph\">${IC.video}<span>Arrastra un video<br/>(lo grabas después)<\u002Fspan><\u002Fdiv>`;\n    }\n  }\n\n  document.addEventListener('dragover', (e) => {\n    const vs = e.target.closest && e.target.closest('.vslot');\n    if (vs) { e.preventDefault(); vs.classList.add('drag'); }\n  });\n  document.addEventListener('dragleave', (e) => {\n    const vs = e.target.closest && e.target.closest('.vslot');\n    if (vs) vs.classList.remove('drag');\n  });\n  document.addEventListener('drop', (e) => {\n    const vs = e.target.closest && e.target.closest('.vslot');\n    if (!vs) return;\n    e.preventDefault(); vs.classList.remove('drag');\n    const f = e.dataTransfer.files && e.dataTransfer.files[0];\n    if (f && f.type.startsWith('video/')) {\n      saveVideo(vs.dataset.vs, f);\n    }\n  });\n  document.addEventListener('click', (e) => {\n    // Quitar video (botón X)\n    const clr = e.target.closest && e.target.closest('.vslot-clear');\n    if (clr) {\n      e.stopPropagation();\n      const vs = clr.closest('.vslot');\n      if (vs) removeVideo(vs.dataset.vs);\n      return;\n    }\n    // Cargar video (clic en slot vacío)\n    const vs = e.target.closest && e.target.closest('.vslot');\n    if (vs && !vs.querySelector('video')) {\n      const inp = document.createElement('input');\n      inp.type = 'file'; inp.accept = 'video/*';\n      inp.onchange = () => {\n        const f = inp.files[0];\n        if (f) saveVideo(vs.dataset.vs, f);\n      };\n      inp.click();\n    }\n  });\n\n  /* -------------------- navigation wiring -------------------- */\n  document.addEventListener('click', (e) => {\n    const g = e.target.closest && e.target.closest('[data-goto]');\n    if (g) { e.preventDefault(); deck() && deck().goTo(+g.dataset.goto); }\n  });\n\n  // intercept keys for open overlays (capture before deck-stage)\n  document.addEventListener('keydown', (e) => {\n    const active = document.querySelector('section.phase[data-deck-active]');\n    const ov = active && active._overlay;\n    if (ov && ov.isOpen()) {\n      if (e.key === 'Escape') { ov.close(); e.stopImmediatePropagation(); }\n      else if (e.key === 'ArrowRight') { ov.next(); e.stopImmediatePropagation(); e.preventDefault(); }\n      else if (e.key === 'ArrowLeft') { ov.prev(); e.stopImmediatePropagation(); e.preventDefault(); }\n    }\n  }, true);\n\n  // close any open overlay when the slide changes\n  deck() && deck().addEventListener('slidechange', () => {\n    document.querySelectorAll('.detail-scrim.open').forEach(s => s.classList.remove('open'));\n  });\n\n  /* -------------------- botón \"Guardar todo en el HTML\" -------------------- */\n  (function () {\n    const VM = window.LP14Media;\n    if (!VM || !VM.downloadBaked) return;\n\n    const btn = document.createElement('button');\n    btn.className = 'lp-export';\n    btn.type = 'button';\n    btn.innerHTML =\n      '<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M12 3v11M8 10l4 4 4-4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\u002Fsvg>' +\n      '<span class=\"lp-export-t\">Guardar todo en el HTML<\u002Fspan>';\n    const status = document.createElement('div');\n    status.className = 'lp-export-status';\n    document.body.appendChild(btn);\n    document.body.appendChild(status);\n\n    let busy = false;\n    btn.addEventListener('click', () => {\n      if (busy) return;\n      busy = true;\n      btn.classList.add('busy');\n      status.classList.add('show');\n      status.classList.remove('err');\n      status.textContent = 'Preparando…';\n      VM.downloadBaked(msg => { status.textContent = msg; })\n        .then(res => {\n          const mb = (res.bytes / 1048576).toFixed(1);\n          status.textContent = `Listo · ${res.photos} foto(s), ${res.videos} video(s) · ${mb} MB`;\n          setTimeout(() => status.classList.remove('show'), 7000);\n        })\n        .catch(e => {\n          status.classList.add('err');\n          status.textContent = 'Error al exportar: ' + (e && e.message ? e.message : e);\n          setTimeout(() => status.classList.remove('show'), 8000);\n        })\n        .then(() => { busy = false; btn.classList.remove('busy'); });\n    });\n  })();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
