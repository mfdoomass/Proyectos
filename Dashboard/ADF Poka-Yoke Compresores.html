document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0e22e258-dad1-4e6f-96a1-8a90295817cb\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  * { box-sizing: border-box; }\n  button { font-family: inherit; }\n  @keyframes adfpulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.3; transform:scale(.6);} }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#F7F6F1;color:#3a3933;min-height:100%;padding-bottom:48px;-webkit-font-smoothing:antialiased;\">\n\n  <div data-screen-label=\"Topbar\" style=\"background:#185FA5;color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;\">\n    <div style=\"font-size:17px;font-weight:500;letter-spacing:.01em;\">ADF Metales · LP-COMP-01<\u002Fdiv>\n    <div style=\"display:flex;border:0.5px solid rgba(255,255,255,.55);border-radius:2px;overflow:hidden;\">\n      <button style=\"{{ opStyle }}\" onclick=\"{{ onOp }}\">Operador<\u002Fbutton>\n      <button style=\"{{ supStyle }}\" onclick=\"{{ onSup }}\">Supervisor<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1080px;margin:0 auto;padding:24px;\">\n\n    <sc-if value=\"{{ isOperador }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"Vista operador\">\n\n        <div style=\"background:#fff;border:0.5px solid #d9d6cc;border-radius:2px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;\">\n          <div style=\"font-size:15px;font-weight:500;color:#185FA5;\">Responsable del arranque<\u002Fdiv>\n          <select style=\"{{ selectStyle }}\" onchange=\"{{ onResponsable }}\" value=\"{{ responsable }}\">\n            <option value=\"\">Selecciona responsable…<\u002Foption>\n            <sc-for list=\"{{ operadores }}\" as=\"op\" hint-placeholder-count=\"7\">\n              <option value=\"{{ op }}\">{{ op }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fselect>\n          <sc-if value=\"{{ tieneResponsable }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"background:#EAF3DE;color:#3B6D11;border:0.5px solid #3B6D11;padding:6px 12px;border-radius:2px;font-size:13px;font-weight:500;\">Documenta: {{ responsable }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;\">\n          <sc-for list=\"{{ compresores }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"{{ c.cardStyle }}\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;\">\n                <span style=\"font-size:13px;letter-spacing:.04em;\">Compresor<\u002Fspan>\n                <span style=\"{{ c.dotStyle }}\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:52px;font-weight:500;line-height:1;margin:12px 0 8px;\">{{ c.letra }}<\u002Fdiv>\n              <div style=\"font-size:14px;\">{{ c.estadoLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.45fr 1fr;gap:20px;\">\n\n          <div style=\"display:flex;flex-direction:column;gap:18px;\">\n\n            <div style=\"{{ instrStyle }}\" data-screen-label=\"Instrucción\">{{ instrText }}<\u002Fdiv>\n\n            <div style=\"background:#fff;border:0.5px solid #d9d6cc;border-radius:2px;padding:20px;\">\n              <div style=\"font-size:15px;font-weight:500;color:#185FA5;margin-bottom:16px;\">Ciclo de rotación<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;\">\n                <div style=\"{{ nodeStyleA }}\">A<\u002Fdiv>\n                <span style=\"color:#888780;font-size:20px;\">→<\u002Fspan>\n                <div style=\"{{ nodeStyleB }}\">B<\u002Fdiv>\n                <span style=\"color:#888780;font-size:20px;\">→<\u002Fspan>\n                <div style=\"{{ nodeStyleC }}\">C<\u002Fdiv>\n                <span style=\"color:#888780;font-size:20px;\">↺<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"text-align:center;color:#888780;font-size:13px;margin-top:16px;\">Rotación fija A → B → C → A · descansa un compresor por turno<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:0.5px solid #d9d6cc;border-radius:2px;padding:20px;\">\n              <div style=\"font-size:15px;font-weight:500;color:#185FA5;margin-bottom:6px;\">Ficha de descanso<\u002Fdiv>\n              <div style=\"font-size:13px;color:#888780;margin-bottom:14px;\">Coloca la ficha en el compresor que debe descansar.<\u002Fdiv>\n              <div style=\"display:flex;gap:10px;\">\n                <sc-for list=\"{{ fichaButtons }}\" as=\"b\" hint-placeholder-count=\"4\">\n                  <button style=\"{{ b.btnStyle }}\" onclick=\"{{ b.onClick }}\" disabled=\"{{ b.disabled }}\">{{ b.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;margin-top:18px;\">\n                <button style=\"{{ iniciarStyle }}\" onclick=\"{{ onIniciar }}\" disabled=\"{{ iniciarDisabled }}\">Iniciar turno<\u002Fbutton>\n                <button style=\"{{ confirmStyle }}\" onclick=\"{{ onConfirmar }}\" disabled=\"{{ confirmDisabled }}\">Confirmar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:0.5px solid #d9d6cc;border-radius:2px;padding:20px;\">\n            <div style=\"font-size:15px;font-weight:500;color:#185FA5;margin-bottom:14px;\">Bitácora del turno<\u002Fdiv>\n            <sc-if value=\"{{ hasBitacora }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-for list=\"{{ bitacora }}\" as=\"e\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid #F1EFE8;\">\n                  <span style=\"{{ e.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font-size:14px;\">{{ e.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ bitacoraEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"color:#888780;font-size:14px;\">Sin eventos aún.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSupervisor }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Vista supervisor\">\n\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;\">\n          <div style=\"font-size:13px;color:#888780;\">Los datos se guardan en la tablet y sobreviven reinicios.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <button style=\"{{ exportStyle }}\" onclick=\"{{ onExportCSV }}\" disabled=\"{{ exportDisabled }}\">Exportar CSV<\u002Fbutton>\n            <button style=\"padding:11px 18px;border:0.5px solid #A32D2D;background:#fff;color:#A32D2D;border-radius:2px;font-size:14px;font-weight:500;cursor:pointer;\" onclick=\"{{ onReset }}\">Reiniciar datos<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;\">\n          <sc-for list=\"{{ metricsCards }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"{{ m.cardStyle }}\">\n              <div style=\"font-size:13px;color:#888780;line-height:1.3;\">{{ m.label }}<\u002Fdiv>\n              <div style=\"{{ m.valueStyle }}\">{{ m.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ pingpong }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#FFF1E8;border:0.5px solid #E05C00;color:#E05C00;padding:16px 18px;border-radius:2px;margin-bottom:20px;font-size:15px;\">Advertencia: patrón ping-pong detectado en la rotación. Revisa la secuencia de turnos.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;\">\n\n          <div style=\"background:#fff;border:0.5px solid #d9d6cc;border-radius:2px;padding:20px;\">\n            <div style=\"font-size:15px;font-weight:500;color:#185FA5;margin-bottom:6px;\">Balance de desgaste<\u002Fdiv>\n            <div style=\"font-size:13px;color:#888780;margin-bottom:16px;\">Días de descanso acumulados por compresor.<\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-end;justify-content:space-around;gap:20px;\">\n              <sc-for list=\"{{ barras }}\" as=\"bar\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;align-items:center;\">\n                  <div style=\"height:150px;display:flex;align-items:flex-end;\">\n                    <div style=\"{{ bar.barStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ bar.letraStyle }}\">{{ bar.letra }}<\u002Fdiv>\n                  <div style=\"font-size:13px;color:#888780;\">{{ bar.valorLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:0.5px solid #d9d6cc;border-radius:2px;padding:20px;\">\n            <div style=\"font-size:15px;font-weight:500;color:#185FA5;margin-bottom:14px;\">Historial de turnos<\u002Fdiv>\n            <sc-if value=\"{{ hasChips }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n                <sc-for list=\"{{ chips }}\" as=\"ch\" hint-placeholder-count=\"3\">\n                  <span style=\"{{ ch.chipStyle }}\">{{ ch.text }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ chipsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"color:#888780;font-size:14px;\">Sin turnos registrados.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:0.5px solid #d9d6cc;border-radius:2px;padding:20px;\">\n          <div style=\"font-size:15px;font-weight:500;color:#185FA5;margin-bottom:14px;\">Log de eventos<\u002Fdiv>\n          <sc-if value=\"{{ hasLog }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"max-height:280px;overflow:auto;\">\n              <sc-for list=\"{{ logEvents }}\" as=\"e\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid #F1EFE8;\">\n                  <span style=\"{{ e.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font-size:14px;\">{{ e.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ logEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#888780;font-size:14px;\">Sin eventos registrados.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    view: 'operador',\n    responsable: '',\n    descansoAyer: 2,\n    descansoHoy: null,\n    dia: 0,\n    fase: 'idle',\n    ficha: null,\n    fichaCorrecta: false,\n    historial: [],\n    descansos: [0, 0, 0],\n    erroresFicha: 0,\n    turnosConfirmados: 0,\n    bitacora: [],\n    log: [],\n    turnos: [],\n  };\n\n  STORE_KEY = 'adf_lpcomp01_v1';\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(this.STORE_KEY);\n      if (raw) {\n        const d = JSON.parse(raw);\n        this.setState({\n          descansoAyer: d.descansoAyer ?? 2,\n          dia: d.dia ?? 0,\n          historial: d.historial ?? [],\n          descansos: d.descansos ?? [0, 0, 0],\n          erroresFicha: d.erroresFicha ?? 0,\n          turnosConfirmados: d.turnosConfirmados ?? 0,\n          bitacora: d.bitacora ?? [],\n          log: d.log ?? [],\n          turnos: d.turnos ?? [],\n        });\n      }\n    } catch (e) {}\n  }\n\n  componentDidUpdate() {\n    try {\n      const s = this.state;\n      localStorage.setItem(this.STORE_KEY, JSON.stringify({\n        descansoAyer: s.descansoAyer, dia: s.dia, historial: s.historial,\n        descansos: s.descansos, erroresFicha: s.erroresFicha,\n        turnosConfirmados: s.turnosConfirmados, bitacora: s.bitacora, log: s.log, turnos: s.turnos,\n      }));\n    } catch (e) {}\n  }\n\n  onExportCSV = () => {\n    const rows = [['Turno', 'Fecha', 'Hora', 'Compresor que descanso', 'Responsable']];\n    this.state.turnos.forEach((t) => rows.push([t.turno, t.fecha, t.hora, t.descanso, t.responsable]));\n    rows.push([]);\n    rows.push(['Turnos confirmados', this.state.turnosConfirmados]);\n    rows.push(['Errores de ficha', this.state.erroresFicha]);\n    const csv = rows.map((r) => r.map((c) => `\"${String(c).replace(/\"/g, '\"\"')}\"`).join(',')).join('\\n');\n    const blob = new Blob(['\\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'historico_LP-COMP-01.csv';\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  };\n\n  onReset = () => {\n    if (!window.confirm('¿Borrar todo el histórico guardado? Esta acción no se puede deshacer.')) return;\n    try { localStorage.removeItem(this.STORE_KEY); } catch (e) {}\n    this.setState({\n      descansoAyer: 2, descansoHoy: null, dia: 0, fase: 'idle', ficha: null, fichaCorrecta: false,\n      responsable: '', historial: [], descansos: [0, 0, 0], erroresFicha: 0, turnosConfirmados: 0,\n      bitacora: [], log: [], turnos: [],\n    });\n  };\n\n  siguiente = (i) => (i + 1) % 3;\n\n  onResponsable = (e) => this.setState({ responsable: e.target.value });\n\n  onOp = () => this.setState({ view: 'operador' });\n  onSup = () => this.setState({ view: 'supervisor' });\n\n  onIniciar = () => this.setState((s) => {\n    if (s.fase === 'guiando' || !s.responsable) return null;\n    const L = ['A', 'B', 'C'];\n    const x = (s.descansoAyer + 1) % 3;\n    const turno = s.dia + 1;\n    const ev = { ok: true, text: `Turno ${turno} · iniciado por ${s.responsable}, descansa ${L[x]}`, turno };\n    return {\n      descansoHoy: x, fase: 'guiando', ficha: null, fichaCorrecta: false,\n      bitacora: s.bitacora.concat([ev]), log: s.log.concat([ev]),\n    };\n  });\n\n  onFicha = (val) => this.setState((s) => {\n    if (s.fase !== 'guiando') return null;\n    const L = ['A', 'B', 'C'];\n    const turno = s.dia + 1;\n    if (val === null) return { ficha: null, fichaCorrecta: false };\n    if (val === s.descansoHoy) {\n      const ev = { ok: true, text: `Turno ${turno} · ficha correcta en ${L[val]}`, turno };\n      return { ficha: val, fichaCorrecta: true, bitacora: s.bitacora.concat([ev]), log: s.log.concat([ev]) };\n    }\n    const ev = { ok: false, text: `Turno ${turno} · ficha incorrecta en ${L[val]}`, turno };\n    return {\n      ficha: val, fichaCorrecta: false, erroresFicha: s.erroresFicha + 1,\n      bitacora: s.bitacora.concat([ev]), log: s.log.concat([ev]),\n    };\n  });\n\n  onConfirmar = () => this.setState((s) => {\n    if (s.fase !== 'guiando' || !s.fichaCorrecta) return null;\n    const L = ['A', 'B', 'C'];\n    const x = s.descansoHoy;\n    const turno = s.dia + 1;\n    const ev = { ok: true, text: `Turno ${turno} · confirmado por ${s.responsable}, descansó ${L[x]}`, turno };\n    const descansos = s.descansos.slice(); descansos[x]++;\n    const now = new Date();\n    const rec = { turno, fecha: now.toLocaleDateString('es-MX'), hora: now.toLocaleTimeString('es-MX'), descanso: L[x], responsable: s.responsable };\n    return {\n      descansoAyer: x, dia: s.dia + 1, turnosConfirmados: s.turnosConfirmados + 1,\n      descansos, historial: s.historial.concat([x]), turnos: s.turnos.concat([rec]),\n      fase: 'listo', ficha: null, fichaCorrecta: false, responsable: '',\n      bitacora: s.bitacora.concat([ev]), log: s.log.concat([ev]),\n    };\n  });\n\n  detectPingPong(h) {\n    if (h.length < 4) return false;\n    const s = h.slice(-4);\n    return s[0] === s[2] && s[1] === s[3] && s[0] !== s[1];\n  }\n\n  renderVals() {\n    const s = this.state;\n    const L = ['A', 'B', 'C'];\n    const compColor = ['#A32D2D', '#185FA5', '#3B6D11'];\n    const claro = ['#FCEBEB', '#E6F1FB', '#EAF3DE'];\n    const { descansoHoy, fase } = s;\n    const guiando = fase === 'guiando';\n\n    const toggleBase = { padding: '9px 20px', border: 'none', fontSize: '14px', fontWeight: '500', cursor: 'pointer' };\n    const opStyle = s.view === 'operador'\n      ? { ...toggleBase, background: '#fff', color: '#185FA5' }\n      : { ...toggleBase, background: 'transparent', color: '#fff' };\n    const supStyle = s.view === 'supervisor'\n      ? { ...toggleBase, background: '#fff', color: '#185FA5' }\n      : { ...toggleBase, background: 'transparent', color: '#fff' };\n\n    const estMap = {\n      ENCENDIDO: { bg: '#E6F1FB', bd: '#185FA5', fg: '#185FA5', dot: '#185FA5', label: 'Encendido', pulse: true },\n      DESCANSANDO: { bg: '#FCEBEB', bd: '#A32D2D', fg: '#A32D2D', dot: '#A32D2D', label: 'Descansando', pulse: false },\n      PENDIENTE: { bg: '#F1EFE8', bd: '#888780', fg: '#888780', dot: '#888780', label: 'Pendiente', pulse: false },\n    };\n    const compresores = L.map((letra, i) => {\n      let estado;\n      if (descansoHoy === null) estado = 'PENDIENTE';\n      else if (i === descansoHoy) estado = 'DESCANSANDO';\n      else estado = 'ENCENDIDO';\n      const m = estMap[estado];\n      return {\n        letra,\n        estadoLabel: m.label,\n        cardStyle: { background: m.bg, border: '0.5px solid ' + m.bd, color: m.fg, padding: '18px', borderRadius: '2px' },\n        dotStyle: { width: '14px', height: '14px', borderRadius: '50%', background: m.dot, display: 'inline-block', ...(m.pulse ? { animation: 'adfpulse 1.4s ease-in-out infinite' } : {}) },\n      };\n    });\n\n    // Instruction box\n    const ik = { gris: { bg: '#F1EFE8', bd: '#888780', fg: '#4a4944' }, azul: { bg: '#E6F1FB', bd: '#185FA5', fg: '#185FA5' }, verde: { bg: '#EAF3DE', bd: '#3B6D11', fg: '#3B6D11' }, rojo: { bg: '#FCEBEB', bd: '#A32D2D', fg: '#A32D2D' } };\n    let kind = 'gris', instrText = '';\n    if (fase === 'idle') { kind = 'gris'; instrText = s.responsable ? 'Presiona iniciar turno para comenzar la rotación.' : 'Selecciona el responsable del arranque para poder iniciar turno.'; }\n    else if (fase === 'listo') { kind = 'verde'; instrText = 'Turno confirmado. Presiona iniciar turno para el siguiente.'; }\n    else {\n      const x = descansoHoy; const others = [0, 1, 2].filter((j) => j !== x);\n      if (s.ficha === null) { kind = 'azul'; instrText = `Descansa ${L[x]}. Enciende ${L[others[0]]} y ${L[others[1]]}. Coloca la ficha en ${L[x]}.`; }\n      else if (s.fichaCorrecta) { kind = 'verde'; instrText = `Ficha correcta en ${L[x]}. Listo para confirmar.`; }\n      else { kind = 'rojo'; instrText = `Error: la ficha está en ${L[s.ficha]}. Muévela a ${L[x]}.`; }\n    }\n    const im = ik[kind];\n    const instrStyle = { padding: '16px 18px', border: '0.5px solid ' + im.bd, background: im.bg, color: im.fg, borderRadius: '2px', fontSize: '15px', lineHeight: '1.45', minHeight: '58px', display: 'flex', alignItems: 'center' };\n\n    // Rotation nodes\n    const nodeBase = (i, active) => ({\n      width: '52px', height: '52px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',\n      fontSize: '21px', fontWeight: '500', border: '0.5px solid ' + compColor[i],\n      background: active ? compColor[i] : '#fff', color: active ? '#fff' : compColor[i],\n      transform: active ? 'scale(1.18)' : 'scale(1)', transition: 'transform .2s',\n    });\n    const nodeStyleA = nodeBase(0, descansoHoy === 0);\n    const nodeStyleB = nodeBase(1, descansoHoy === 1);\n    const nodeStyleC = nodeBase(2, descansoHoy === 2);\n\n    // Ficha buttons\n    const opts = [{ label: 'A', value: 0 }, { label: 'B', value: 1 }, { label: 'C', value: 2 }, { label: 'Sin ficha', value: null }];\n    const fichaButtons = opts.map((o) => {\n      const active = s.ficha === o.value;\n      let bg = '#fff', fg = '#3a3933', bd = '#888780';\n      if (active) {\n        if (o.value === null) { bg = '#888780'; fg = '#fff'; bd = '#888780'; }\n        else if (o.value === descansoHoy) { bg = '#3B6D11'; fg = '#fff'; bd = '#3B6D11'; }\n        else { bg = '#A32D2D'; fg = '#fff'; bd = '#A32D2D'; }\n      }\n      const disabled = !guiando;\n      return {\n        label: o.label, disabled,\n        onClick: disabled ? (() => {}) : (() => this.onFicha(o.value)),\n        btnStyle: { flex: '1', padding: '12px 0', border: '0.5px solid ' + bd, background: bg, color: fg, borderRadius: '2px', fontSize: '15px', fontWeight: '500', cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.5 : 1 },\n      };\n    });\n\n    const operadores = ['Tacho', 'Lamberto', 'Tiburcio', 'Jose Luis', 'Jovani', 'Eugenio', 'Victor'];\n    const tieneResponsable = !!s.responsable;\n    const selectStyle = { padding: '10px 14px', border: '0.5px solid #888780', borderRadius: '2px', fontSize: '15px', background: '#fff', color: s.responsable ? '#3a3933' : '#888780', minWidth: '220px', fontFamily: 'inherit', cursor: 'pointer' };\n\n    const canConfirm = guiando && s.fichaCorrecta;\n    const confirmStyle = { padding: '13px 22px', border: '0.5px solid ' + (canConfirm ? '#3B6D11' : '#888780'), background: canConfirm ? '#3B6D11' : '#F1EFE8', color: canConfirm ? '#fff' : '#888780', borderRadius: '2px', fontSize: '15px', fontWeight: '500', cursor: canConfirm ? 'pointer' : 'not-allowed', flex: '1' };\n    const canIniciar = !guiando && tieneResponsable;\n    const iniciarStyle = { padding: '13px 22px', border: '0.5px solid ' + (canIniciar ? '#185FA5' : '#888780'), background: canIniciar ? '#185FA5' : '#F1EFE8', color: canIniciar ? '#fff' : '#888780', borderRadius: '2px', fontSize: '15px', fontWeight: '500', cursor: canIniciar ? 'pointer' : 'not-allowed', flex: '1' };\n\n    const mkDot = (ok) => ({ width: '10px', height: '10px', borderRadius: '50%', background: ok ? '#3B6D11' : '#A32D2D', flex: '0 0 auto', display: 'inline-block' });\n    const bitacora = s.bitacora.slice(-6).reverse().map((ev) => ({ text: ev.text, dotStyle: mkDot(ev.ok) }));\n    const logEvents = s.log.slice().reverse().map((ev) => ({ text: ev.text, dotStyle: mkDot(ev.ok) }));\n\n    const chips = s.historial.map((x, idx) => ({\n      text: `T${idx + 1}: descansó ${L[x]}`,\n      chipStyle: { background: claro[x], color: compColor[x], border: '0.5px solid ' + compColor[x], padding: '6px 12px', borderRadius: '2px', fontSize: '13px', fontWeight: '500' },\n    }));\n\n    const max = Math.max(s.descansos[0], s.descansos[1], s.descansos[2], 1);\n    const barras = [0, 1, 2].map((i) => {\n      const v = s.descansos[i];\n      const h = v > 0 ? Math.max(8, Math.round((v / max) * 140)) : 4;\n      return {\n        letra: L[i], valorLabel: `${v} días`,\n        barStyle: { width: '56px', height: h + 'px', background: compColor[i], borderRadius: '2px 2px 0 0' },\n        letraStyle: { color: compColor[i], fontWeight: '500', marginTop: '8px' },\n      };\n    });\n\n    const pingpong = this.detectPingPong(s.historial);\n    const total = s.descansos[0] + s.descansos[1] + s.descansos[2];\n    const allEqual = s.descansos[0] === s.descansos[1] && s.descansos[1] === s.descansos[2];\n    let mas = '—';\n    if (total > 0 && !allEqual) {\n      let mi = 0; for (let i = 1; i < 3; i++) if (s.descansos[i] > s.descansos[mi]) mi = i; mas = L[mi];\n    }\n\n    const cardN = { background: '#fff', border: '0.5px solid #888780', padding: '18px', borderRadius: '2px' };\n    const cardW = { background: '#FCEBEB', border: '0.5px solid #A32D2D', padding: '18px', borderRadius: '2px' };\n    const cardO = { background: '#FFF1E8', border: '0.5px solid #E05C00', padding: '18px', borderRadius: '2px' };\n    const vstyle = (c) => ({ fontSize: '34px', fontWeight: '500', marginTop: '8px', color: c });\n    const metricsCards = [\n      { label: 'Turnos confirmados', value: String(s.turnosConfirmados), cardStyle: cardN, valueStyle: vstyle('#185FA5') },\n      { label: 'Errores de ficha', value: String(s.erroresFicha), cardStyle: s.erroresFicha > 0 ? cardW : cardN, valueStyle: vstyle(s.erroresFicha > 0 ? '#A32D2D' : '#3a3933') },\n      { label: 'Ping-pong detectado', value: pingpong ? 'Sí' : 'No', cardStyle: pingpong ? cardO : cardN, valueStyle: vstyle(pingpong ? '#E05C00' : '#3B6D11') },\n      { label: 'Compresor más descansado', value: mas, cardStyle: cardN, valueStyle: vstyle('#3a3933') },\n    ];\n\n    return {\n      isOperador: s.view === 'operador',\n      isSupervisor: s.view === 'supervisor',\n      opStyle, supStyle, onOp: this.onOp, onSup: this.onSup,\n      operadores, responsable: s.responsable, tieneResponsable, selectStyle, onResponsable: this.onResponsable,\n      compresores,\n      instrText, instrStyle,\n      nodeStyleA, nodeStyleB, nodeStyleC,\n      fichaButtons,\n      iniciarStyle, confirmStyle,\n      iniciarDisabled: !canIniciar, confirmDisabled: !canConfirm,\n      onIniciar: this.onIniciar, onConfirmar: this.onConfirmar,\n      bitacora, hasBitacora: bitacora.length > 0, bitacoraEmpty: bitacora.length === 0,\n      metricsCards, pingpong,\n      onExportCSV: this.onExportCSV, onReset: this.onReset, exportDisabled: s.turnos.length === 0,\n      exportStyle: { padding: '11px 18px', border: '0.5px solid ' + (s.turnos.length === 0 ? '#888780' : '#185FA5'), background: s.turnos.length === 0 ? '#F1EFE8' : '#185FA5', color: s.turnos.length === 0 ? '#888780' : '#fff', borderRadius: '2px', fontSize: '14px', fontWeight: '500', cursor: s.turnos.length === 0 ? 'not-allowed' : 'pointer' },\n      barras,\n      chips, hasChips: chips.length > 0, chipsEmpty: chips.length === 0,\n      logEvents, hasLog: logEvents.length > 0, logEmpty: logEvents.length === 0,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
